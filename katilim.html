<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Katılımını işaretle · Tarih Vakfı</title>
<link rel="stylesheet" href="./css/site.css" />
<style>
  body { max-width: 480px; margin: 0 auto; padding: 24px 20px 60px; background: var(--paper); font-family: var(--font, inherit); }
  .ci-card { background: var(--paper-soft); border: 1px solid var(--rule); border-radius: 12px; padding: 22px; margin-bottom: 18px; }
  .ci-title { font-size: 20px; font-weight: 600; color: var(--ink); margin: 0 0 4px; }
  .ci-sub { font-size: 13px; color: var(--ink-mute); margin: 0 0 18px; }
  .ci-field { margin-bottom: 14px; }
  .ci-field label { display: block; font-size: 12px; color: var(--ink-mute); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .03em; }
  .ci-optional-tag { text-transform: none; font-style: italic; color: var(--ink-faint); letter-spacing: normal; }
  .ci-field input[type="password"], .ci-field select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--rule);
    background: var(--paper); color: var(--ink); font-size: 15px; box-sizing: border-box;
  }
  .ci-btn {
    width: 100%; padding: 11px; border-radius: 8px; border: none; background: var(--accent);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .ci-btn:disabled { opacity: .5; cursor: default; }
  .ci-days { display: flex; flex-direction: column; gap: 10px; }
  .ci-day {
    padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper);
  }
  .ci-day.is-today { border-color: var(--accent); background: var(--accent-bg); }
  .ci-day.is-past { opacity: .55; }
  .ci-locked-badge { font-size: 11px; color: var(--ink-mute); background: var(--rule); padding: 4px 10px; border-radius: 999px; flex-shrink: 0; }
  .ci-day-top { display: flex; align-items: center; justify-content: space-between; }
  .ci-day-label { font-size: 14px; color: var(--ink); }
  .ci-day-date { font-size: 11px; color: var(--ink-mute); display: block; }
  .ci-day-count { font-size: 11px; color: var(--accent); display: block; margin-top: 2px; }
  .ci-day-names { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .ci-name-chip { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--paper-soft); border: 1px solid var(--rule); color: var(--ink); }
  .ci-name-empty { font-size: 11px; color: var(--ink-faint); font-style: italic; }
  .ci-toggle { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .ci-toggle input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .ci-toggle .track {
    position: absolute; inset: 0; background: var(--rule); border-radius: 13px; transition: background .15s ease; pointer-events: none;
  }
  .ci-toggle .knob {
    position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s ease; pointer-events: none;
  }
  .ci-toggle input:checked ~ .track { background: var(--accent); }
  .ci-toggle input:checked ~ .knob { left: 23px; }
  .ci-status { font-size: 12px; margin-top: 12px; min-height: 16px; }
  .ci-status.ok { color: #3f7a4f; }
  .ci-status.err { color: #a3324a; }
  .ci-hidden { display: none !important; }
  .ci-back { display: inline-block; margin-top: 6px; font-size: 13px; color: var(--ink-mute); text-decoration: none; }
</style>
</head>
<body>

  <div class="ci-card" id="gateCard">
    <p class="ci-title">Katılımını işaretle</p>
    <p class="ci-sub">Bu hafta hangi gün geleceğini işaretle. Ortak şifreyi koordinatörden öğrenebilirsin.</p>
    <div class="ci-field">
      <label for="pw">Ortak şifre</label>
      <input type="password" id="pw" autocomplete="off" />
    </div>
    <div class="ci-field">
      <label for="nameSelect">Adın</label>
      <select id="nameSelect">
        <option value="">Seç…</option>
      </select>
    </div>
    <button class="ci-btn" id="enterBtn">Devam et</button>
    <p class="ci-status" id="gateStatus"></p>
  </div>

  <div class="ci-card ci-hidden" id="daysCard">
    <p class="ci-title" id="greeting">Merhaba</p>
    <p class="ci-sub">Bu hafta gelecek olduğun günleri işaretle. Her günün yanında o gün kaç kişinin geleceğini de görürsün. Değişiklik anında kaydedilir.</p>
    <div class="ci-field">
      <label for="deviceSelect">Kullanmayı düşündüğün cihaz <span class="ci-optional-tag">(opsiyonel)</span></label>
      <select id="deviceSelect">
        <option value="">Belirtmek istemiyorum</option>
      </select>
    </div>
    <div class="ci-days" id="dayList"></div>
    <p class="ci-status" id="daysStatus"></p>
    <a href="./index.html" class="ci-back">← Panoya dön</a>
  </div>

<script src="./js/config.public.js?v=20260624-foundation-frame"></script>
<script src="./js/snapshot.js?v=20260622-period-copy"></script>
<script src="./js/roster.js?v=20260517-roster"></script>
<script src="./js/utils.js?v=20260624-foundation-frame"></script>
<script>
(function () {
  const TR_WEEKDAYS_5 = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma'];
  const U = window.TVFUtils;
  const pwInput = document.getElementById('pw');
  const nameSelect = document.getElementById('nameSelect');
  const enterBtn = document.getElementById('enterBtn');
  const gateStatus = document.getElementById('gateStatus');
  const gateCard = document.getElementById('gateCard');
  const daysCard = document.getElementById('daysCard');
  const dayList = document.getElementById('dayList');
  const daysStatus = document.getElementById('daysStatus');
  const greeting = document.getElementById('greeting');
  const deviceSelect = document.getElementById('deviceSelect');

  let password = '';
  let selectedName = '';
  let currentByDay = {};
  let weeklyPlan = { days: TR_WEEKDAYS_5, stations: [], extras: {} }; // from content.weeklyPlan (Haftalık Plan sheet)
  let countEls = {}; // day label -> its count <span>, filled by renderDays
  let nameEls = {}; // day label -> its names <div>, filled by renderDays

  // Populate name dropdown from the roster the main dashboard already ships with.
  const roster = (window.TVF_ROSTER && Array.isArray(window.TVF_ROSTER.volunteers)) ? window.TVF_ROSTER.volunteers : [];
  const names = roster.map((v) => v.name).filter(Boolean).sort((a, b) => a.localeCompare(b, 'tr'));
  names.forEach((name) => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    nameSelect.appendChild(opt);
  });
  const customOpt = document.createElement('option');
  customOpt.value = '__other__';
  customOpt.textContent = 'Listede yok, adımı yazacağım…';
  nameSelect.appendChild(customOpt);

  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function weekDates() {
    const now = new Date();
    const todayKey = dateKey(now);
    const day = now.getDay(); // 0 Sun .. 6 Sat
    const mondayOffset = day === 0 ? -6 : 1 - day;
    const monday = new Date(now);
    monday.setDate(now.getDate() + mondayOffset);
    return TR_WEEKDAYS_5.map((label, i) => {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const key = dateKey(d);
      return { label: label, dateLabel: `${d.getDate()}.${d.getMonth() + 1}`, isPast: key < todayKey, isToday: key === todayKey };
    });
  }

  function foldName(v) { return U && U.foldName ? U.foldName(v) : String(v || '').toLowerCase(); }

  // A day's headcount = named station assignees ("Berfin", "Sibel Dağ"…, excluding
  // the placeholder "Gönüllü" which just means "still needs someone") plus anyone
  // who self-checked in via this page (the "Ek gönüllüler" extras).
  function namesForDay(day) {
    const set = new Map();
    (weeklyPlan.stations || []).forEach((s) => {
      const raw = s.byDay && s.byDay[day];
      if (!raw) return;
      const cleaned = raw.trim();
      if (!cleaned || foldName(cleaned) === 'gonullu') return;
      set.set(foldName(cleaned), cleaned);
    });
    ((weeklyPlan.extras && weeklyPlan.extras[day]) || []).forEach((n) => {
      if (n) set.set(foldName(n), n);
    });
    return [...set.values()];
  }

  function dayCountLabel(day) {
    const n = namesForDay(day).length;
    if (n === 0) return 'henüz kimse yok';
    return n === 1 ? '1 kişi geliyor' : `${n} kişi geliyor`;
  }

  async function fetchWeeklyPlan() {
    const fallback = { days: TR_WEEKDAYS_5, stations: [], extras: {} };
    const url = window.__SHEETSYNC_URL__;
    if (!(typeof url === 'string' && url.includes('script.google.com'))) return fallback;
    try {
      const sep = url.includes('?') ? '&' : '?';
      const res = await fetch(`${url}${sep}public=1&period=rolling_7_days&t=${Date.now()}`, { method: 'GET', mode: 'cors', cache: 'no-store' });
      const body = await res.json();
      const plan = body && body.data && body.data.content && body.data.content.weeklyPlan;
      return plan || fallback;
    } catch (err) {
      return fallback;
    }
  }

  function renderDays() {
    dayList.innerHTML = '';
    countEls = {};
    nameEls = {};
    weekDates().forEach(({ label, dateLabel, isPast, isToday }) => {
      const row = document.createElement('div');
      row.className = 'ci-day' + (isToday ? ' is-today' : '') + (isPast ? ' is-past' : '');
      row.dataset.day = label;
      const toggle = isPast
        ? `<span class="ci-locked-badge">geçti</span>`
        : `<label class="ci-toggle">
             <input type="checkbox" data-day="${label}" ${currentByDay[label] ? 'checked' : ''} />
             <span class="track"></span><span class="knob"></span>
           </label>`;
      row.innerHTML = `
        <div class="ci-day-top">
          <div><span class="ci-day-label">${label}</span><span class="ci-day-date">${dateLabel}</span>
            <span class="ci-day-count"></span></div>
          ${toggle}
        </div>
        <div class="ci-day-names"></div>`;
      const countEl = row.querySelector('.ci-day-count');
      const namesEl = row.querySelector('.ci-day-names');
      countEl.textContent = dayCountLabel(label);
      namesEl.innerHTML = namesChipsHtml(label);
      countEls[label] = countEl;
      nameEls[label] = namesEl;
      dayList.appendChild(row);
    });
    dayList.querySelectorAll('input[type="checkbox"]').forEach((box) => {
      box.addEventListener('change', () => sendCheckIn(box.dataset.day, box.checked, box));
    });
  }

  function namesChipsHtml(day) {
    const names = namesForDay(day);
    if (!names.length) return '<span class="ci-name-empty">henüz kimse yok</span>';
    return names.map((n) => `<span class="ci-name-chip">${escapeHtml(n)}</span>`).join('');
  }

  function escapeHtml(v) { return U && U.escapeHtml ? U.escapeHtml(v) : String(v == null ? '' : v); }

  function refreshDayCount(day) {
    if (countEls[day]) countEls[day].textContent = dayCountLabel(day);
    if (nameEls[day]) nameEls[day].innerHTML = namesChipsHtml(day);
  }

  function applyLocalCheckIn(day, present) {
    weeklyPlan.extras = weeklyPlan.extras || {};
    const list = weeklyPlan.extras[day] || [];
    const withoutMe = list.filter((n) => foldName(n) !== foldName(selectedName));
    weeklyPlan.extras[day] = present ? withoutMe.concat([selectedName]) : withoutMe;
    refreshDayCount(day);
  }

  async function sendCheckIn(day, present, checkboxEl) {
    daysStatus.className = 'ci-status';
    daysStatus.textContent = 'Kaydediliyor…';
    const url = window.__SHEETSYNC_URL__;
    if (!(typeof url === 'string' && url.includes('script.google.com'))) {
      daysStatus.className = 'ci-status err';
      daysStatus.textContent = 'Canlı bağlantı yapılandırılmamış — kaydedilemedi.';
      checkboxEl.checked = !present;
      return;
    }
    try {
      const res = await fetch(url, {
        method: 'POST',
        // text/plain avoids a CORS preflight against the Apps Script web app.
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'checkin', password, name: selectedName, day, present, device: deviceSelect ? deviceSelect.value : '' })
      });
      const body = await res.json();
      if (!body || body.ok !== true) throw new Error((body && body.error) || 'unknown_error');
      currentByDay[day] = present;
      applyLocalCheckIn(day, present);
      lastLocalChangeAt = Date.now();
      daysStatus.className = 'ci-status ok';
      daysStatus.textContent = present ? `${day} için işaretlendi ✓` : `${day} için kaldırıldı.`;
    } catch (err) {
      const msg = err && err.message;
      if (msg === 'past_day_locked') {
        daysStatus.className = 'ci-status err';
        daysStatus.textContent = `${day} artık geçmişte kaldı, değiştirilemez.`;
        renderDays(); // re-render so the row flips to its locked "geçti" state
        return;
      }
      daysStatus.className = 'ci-status err';
      daysStatus.textContent = 'Kaydedilemedi, tekrar dener misin? (' + msg + ')';
      checkboxEl.checked = !present;
    }
  }

  let pollTimer = null;
  let lastLocalChangeAt = 0;

  async function syncFromServer(preserveOwnToggles) {
    const fresh = await fetchWeeklyPlan();
    weeklyPlan = fresh;
    if (preserveOwnToggles) {
      // Re-derive my own checkbox state from the server truth too, so a
      // coordinator's manual sheet edit (e.g. removing my name) is reflected.
      (weeklyPlan.days || TR_WEEKDAYS_5).forEach((day) => {
        currentByDay[day] = ((weeklyPlan.extras && weeklyPlan.extras[day]) || []).some((n) => foldName(n) === foldName(selectedName));
      });
    }
    populateDeviceOptions();
    renderDays();
  }

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(() => {
      if (document.visibilityState === 'hidden') return;
      if (Date.now() - lastLocalChangeAt < 4000) return; // let our own optimistic update settle first
      syncFromServer(true);
    }, 20000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && daysCard && !daysCard.classList.contains('ci-hidden')) {
        syncFromServer(true);
      }
    });
  }

  function populateDeviceOptions() {
    if (!deviceSelect) return;
    const stationNames = (weeklyPlan.stations || []).map((s) => s.station).filter(Boolean);
    const current = deviceSelect.value;
    deviceSelect.innerHTML = '<option value="">Belirtmek istemiyorum</option>'
      + stationNames.map((s) => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
    if (stationNames.includes(current)) deviceSelect.value = current;
  }

  enterBtn.addEventListener('click', async () => {
    password = pwInput.value.trim();
    selectedName = nameSelect.value;
    if (selectedName === '__other__') {
      selectedName = window.prompt('Adını yaz:') || '';
    }
    if (!password || !selectedName) {
      gateStatus.className = 'ci-status err';
      gateStatus.textContent = 'Şifre ve isim gerekli.';
      return;
    }
    enterBtn.disabled = true;
    gateStatus.className = 'ci-status';
    gateStatus.textContent = 'Yükleniyor…';
    weeklyPlan = await fetchWeeklyPlan();
    currentByDay = {};
    (weeklyPlan.days || TR_WEEKDAYS_5).forEach((day) => {
      const inExtras = ((weeklyPlan.extras && weeklyPlan.extras[day]) || []).some((n) => foldName(n) === foldName(selectedName));
      currentByDay[day] = inExtras;
    });
    gateCard.classList.add('ci-hidden');
    daysCard.classList.remove('ci-hidden');
    greeting.textContent = `Merhaba, ${selectedName}`;
    populateDeviceOptions();
    renderDays();
    enterBtn.disabled = false;
    startPolling();
  });
})();
</script>
</body>
</html>
