name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh public snapshot
        run: node tools/refresh_public_snapshot.mjs

      - name: Add .nojekyll
        run: touch .nojekyll

      - name: Check required files
        run: |
          test -f index.html
          test -f js/config.public.js
          if [ ! -f js/snapshot.js ]; then
            echo "Warning: js/snapshot.js not found. The site must use the live Apps Script endpoint."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
