name: Deploy to GitHub Pages

# Runs on every push to main, every hour via cron, and on manual dispatch.
# The hourly trigger refreshes js/snapshot.js from the Apps Script endpoint
# right before deploying, so the live site renders instantly with fresh
# numbers on first paint — no commit-back to the repo needed.

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'  # 7 minutes past every hour — refresh snapshot
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add .nojekyll
        run: touch .nojekyll

      - name: Refresh snapshot from Apps Script
        env:
          SHEETSYNC_URL: https://script.google.com/macros/s/AKfycbzSGPTbBnrfhSDdw_iOrfxAfGLYp08qpZwl8rqZSb90o_x5cUK7Eo1HYnrjk-hvJWE/exec
        run: |
          {
            echo "// Auto-generated snapshot — refreshed by .github/workflows/deploy.yml"
            echo "// landing.js renders this immediately on page load (zero network),"
            echo "// then fetches the live Apps Script endpoint and overlays any changes."
            printf "window.__SNAPSHOT__ = "
            curl -sL "${SHEETSYNC_URL}?public=1"
            printf ";\n"
          } > js/snapshot.js
          wc -c js/snapshot.js
          node --check js/snapshot.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
