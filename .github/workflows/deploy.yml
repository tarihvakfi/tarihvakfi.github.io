name: Deploy to GitHub Pages

# Runs on every push to main, every hour via cron, and on manual dispatch.
# The hourly trigger refreshes js/snapshot.js from the Apps Script endpoint
# right before deploying, so the live site renders instantly with fresh
# numbers on first paint — no commit-back to the repo needed.

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'  # 7 minutes past every hour — refresh snapshot
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add .nojekyll
        run: touch .nojekyll

      - name: Refresh snapshot from Apps Script
        env:
          SHEETSYNC_URL: https://script.google.com/macros/s/AKfycbzSGPTbBnrfhSDdw_iOrfxAfGLYp08qpZwl8rqZSb90o_x5cUK7Eo1HYnrjk-hvJWE/exec
        run: |
          tmp="$(mktemp)"
          curl -fsSL "${SHEETSYNC_URL}?public=1" > "$tmp"
          if node - "$tmp" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!payload || payload.ok !== true || !payload.data || !payload.data.publicSummary) {
            process.exit(1);
          }
          const text = JSON.stringify(payload);
          if (/volunteerToken|"id":"sheet_|sheet_[a-z0-9_]*row\d+/i.test(text)) {
            process.exit(1);
          }
          NODE
          then
            {
              echo "// Auto-generated privacy-safe snapshot — refreshed by .github/workflows/deploy.yml"
              echo "// landing.js renders this immediately on page load (zero network),"
              echo "// then fetches the live Apps Script endpoint and overlays newer aggregate data."
              printf "window.__SNAPSHOT__ = "
              cat "$tmp"
              printf ";\n"
            } > js/snapshot.js
          else
            echo "Apps Script endpoint has not deployed the publicSummary contract yet; keeping checked-in snapshot."
          fi
          wc -c js/snapshot.js
          node --check js/snapshot.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
