name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh public snapshot
        run: node tools/refresh_public_snapshot.mjs

      - name: Check required files
        run: |
          test -f index.html
          test -f js/config.public.js
          if [ ! -f js/snapshot.js ]; then
            echo "Warning: js/snapshot.js not found. The site must use the live Apps Script endpoint."
          fi

      - name: Build Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html 404.html yaz-planlamasi.html _site/
          cp -R assets css js kronoloji _site/
          rm -rf _site/kronoloji/apps-script
          rm -f _site/kronoloji/data.html _site/kronoloji/methodology.html
          touch _site/.nojekyll

          test -f _site/index.html
          test -f _site/js/config.public.js
          test ! -e _site/apps-script
          test ! -e _site/tools
          test ! -e _site/docs
          test ! -e _site/_audit
          test ! -e _site/kronoloji/apps-script
          test ! -e _site/kronoloji/data.html
          test ! -e _site/kronoloji/methodology.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
