<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Journal palette variants — A / B / C / D</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; line-height: 1.55; }

  /* Demo bar */
  .demo-bar {
    background: #111; color: #fafafa;
    padding: 11px 20px; position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    font-family: 'DM Mono', monospace; font-size: 12px;
  }
  .demo-bar h1 { font-size: 13px; margin: 0 8px 0 0; font-weight: 500; letter-spacing: 0.06em; }
  .demo-bar button {
    background: transparent; border: 1px solid rgba(255,255,255,0.3);
    color: #fafafa; padding: 6px 12px;
    font: inherit; font-size: 11px; cursor: pointer; transition: all .2s;
    letter-spacing: 0.04em;
  }
  .demo-bar button:hover { background: rgba(255,255,255,0.08); }
  .demo-bar button.active { background: #fafafa; color: #111; border-color: #fafafa; }
  .demo-bar .meta { margin-left: auto; opacity: .55; font-size: 11px; }

  .demo { display: none; }
  .demo.active { display: block; }

  /* ======================================================================
   * Shared layout — all variants reuse this structure
   * Variant-specific styling comes from .alt-X overrides at the bottom
   * ====================================================================== */
  .page { max-width: 880px; margin: 0 auto; padding: 32px 28px 60px; }

  .masthead {
    border-bottom: 1px solid var(--rule);
    padding-bottom: 14px;
    margin-bottom: 32px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px; align-items: baseline;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .masthead .l { text-align: left; }
  .masthead .m { text-align: center; color: var(--ink); font-weight: 500; }
  .masthead .m b { color: var(--accent); }
  .masthead .r { text-align: right; }
  .masthead .pulse {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--live); margin-right: 5px; vertical-align: 1px;
  }

  .intro { padding: 24px 0; }
  .intro .label {
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-mute); margin: 0 0 16px;
  }
  .intro h1 {
    font-family: var(--display);
    font-size: clamp(46px, 6vw, 68px);
    line-height: 1.02;
    letter-spacing: -0.015em;
    margin: 0 0 14px;
    font-weight: 500;
    color: var(--ink);
  }
  .intro h1 em { font-style: italic; color: var(--accent); }
  .intro .lede {
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.65;
    color: var(--ink-soft);
    max-width: 620px;
    margin: 0;
  }
  .intro .lede b { font-weight: 600; color: var(--ink); }

  .now {
    margin: 36px 0 0;
    padding: 22px 26px;
    border: 1px solid var(--rule);
    border-left: 3px solid var(--accent);
    background: var(--card);
    position: relative;
    display: grid; grid-template-columns: 48px 1fr auto;
    gap: 16px; align-items: center;
  }
  .now .badge {
    position: absolute; top: -10px; left: 18px;
    background: var(--paper); padding: 1px 10px;
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .now .av {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--accent); color: var(--paper);
    display: grid; place-items: center;
    font-family: var(--display); font-size: 20px;
  }
  .now .who { font-family: var(--display); font-size: 19px; line-height: 1.15; font-weight: 500; margin: 0 0 4px; }
  .now .who em { font-style: italic; color: var(--accent); }
  .now .what { font-family: var(--body); font-style: italic; color: var(--ink-mute); font-size: 13.5px; }
  .now .pages {
    text-align: right;
    font-family: var(--display);
    font-size: 34px; color: var(--accent); line-height: 1;
    font-style: italic; font-variant-numeric: oldstyle-nums;
  }
  .now .pages small {
    display: block; font-size: 10px; color: var(--ink-mute);
    font-family: var(--mono); letter-spacing: 0.16em;
    text-transform: uppercase; margin-top: 5px; font-style: normal;
  }

  .glance {
    margin: 36px 0 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 22px 0;
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr 1fr;
    gap: 10px;
  }
  .glance > div { padding: 0 14px 0 0; border-right: 1px solid var(--rule-soft); }
  .glance > div:last-child { border-right: 0; padding-right: 0; }
  .glance .lbl {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-mute); margin: 0 0 8px;
  }
  .glance .v {
    font-family: var(--display); font-size: 32px;
    font-weight: 500; line-height: 1; margin: 0;
    font-variant-numeric: oldstyle-nums; color: var(--ink);
  }
  .glance .v em { font-style: italic; color: var(--accent); }
  .glance .v small {
    font-size: 13px; color: var(--ink-mute);
    margin-left: 3px; font-family: var(--body); font-weight: normal;
  }
  .glance .f { font-size: 11.5px; color: var(--ink-mute); margin: 6px 0 0; font-style: italic; font-family: var(--body); }
  .glance .spark { display: flex; align-items: end; gap: 3px; height: 36px; margin-top: 8px; }
  .glance .spark .b { flex: 1; background: var(--accent); opacity: 0.6; min-height: 2px; }
  .glance .spark .b.today { opacity: 1; background: var(--accent); }
  .glance .spark .b.quiet { opacity: 0.15; }

  .section-head {
    padding: 40px 0 18px;
    text-align: center;
  }
  .section-head h2 {
    font-family: var(--display);
    font-size: clamp(28px, 4vw, 38px);
    line-height: 1.05; font-weight: 500;
    margin: 0;
  }
  .section-head h2 em { font-style: italic; color: var(--accent); }
  .section-head .tag {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-mute); margin: 10px 0 0;
  }

  .days { margin-top: 4px; }
  .day {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 26px;
    padding: 22px 0;
    border-bottom: 1px dashed var(--rule);
    align-items: start;
  }
  .day:last-child { border-bottom: 0; }
  .day .date { border-top: 2px solid var(--ink); padding-top: 6px; }
  .day .date .dn {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-mute);
  }
  .day .date .dom {
    font-family: var(--display); font-size: 44px;
    line-height: 1; color: var(--ink); margin-top: 4px;
    font-weight: 500; font-variant-numeric: oldstyle-nums;
    letter-spacing: -0.02em;
  }
  .day .date .stats {
    margin-top: 12px;
    font-family: var(--mono); font-size: 10px;
    color: var(--ink-mute); line-height: 1.7;
  }
  .day .date .stats b {
    color: var(--accent);
    font-family: var(--display);
    font-size: 15px; letter-spacing: 0; font-style: italic;
  }
  .day .body p {
    margin: 0 0 10px;
    font-family: var(--body);
    font-size: 15.5px; line-height: 1.72;
    color: var(--ink);
  }
  .day .body em.name { font-style: italic; color: var(--accent); font-weight: 500; }
  .day .body .tag {
    display: inline-block;
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.06em;
    background: var(--tag-bg); color: var(--tag-fg);
    padding: 2px 7px; margin: 0 2px; vertical-align: 1px;
  }
  .day .body .delta { font-family: var(--display); font-style: italic; color: var(--accent); font-weight: 500; }
  .day.today {
    background: var(--today-bg);
    padding: 28px 24px 24px;
    margin: 0 -24px;
    border-top: 1px solid var(--accent);
    border-bottom: 1px solid var(--accent);
    position: relative;
  }
  .day.today::before {
    content: '· bugün ·';
    position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
    background: var(--paper); padding: 2px 12px;
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--accent); border: 1px solid var(--accent);
  }
  .day.today .date .dom { color: var(--accent); }
  .day.quiet .body { color: var(--ink-mute); font-style: italic; }
  .day.quiet .body p { font-size: 14px; margin: 0; }
  .day.quiet .date .dom { opacity: 0.45; }

  .colophon {
    margin-top: 50px; padding-top: 24px;
    border-top: 1px solid var(--rule);
    text-align: center;
  }
  .colophon p { margin: 0 0 6px; font-size: 13px; color: var(--ink-mute); font-family: var(--body); }
  .colophon a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 1px; }
  .colophon .signoff {
    margin-top: 18px;
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-mute);
  }

  /* ======================================================================
   * A — INK & VERMILLION
   * Pure white, near-black ink, single red accent. Modernist. Crimson Pro
   * serif. Sparse. Strong.
   * ====================================================================== */
  .alt-a {
    background: #ffffff;
    --paper: #ffffff;
    --ink: #0a0a0a;
    --ink-soft: #1f1f1f;
    --ink-mute: rgba(10,10,10,0.55);
    --rule: rgba(10,10,10,0.18);
    --rule-soft: rgba(10,10,10,0.08);
    --accent: #d63a2a;
    --live: #2e8b57;
    --card: #fafafa;
    --tag-bg: rgba(214,58,42,0.10);
    --tag-fg: #b03020;
    --today-bg: #fff7f5;
    --display: 'Crimson Pro', Georgia, serif;
    --body: 'Crimson Pro', Georgia, serif;
    --mono: 'DM Mono', ui-monospace, monospace;
    color: var(--ink);
    min-height: 100vh;
  }

  /* ======================================================================
   * B — LIBRARY BLUE
   * Ivory paper, deep navy ink, oxblood accent. Scholarly, restrained.
   * Playfair Display + Inter body.
   * ====================================================================== */
  .alt-b {
    background: #f5f1e8;
    --paper: #f5f1e8;
    --ink: #1a2238;
    --ink-soft: #2a334d;
    --ink-mute: rgba(26,34,56,0.55);
    --rule: rgba(26,34,56,0.18);
    --rule-soft: rgba(26,34,56,0.08);
    --accent: #7a2a1d;
    --live: #4a7c4a;
    --card: #fcf9f1;
    --tag-bg: rgba(122,42,29,0.10);
    --tag-fg: #6a2418;
    --today-bg: rgba(122,42,29,0.04);
    --display: 'Playfair Display', Georgia, serif;
    --body: 'Inter', sans-serif;
    --mono: 'DM Mono', ui-monospace, monospace;
    color: var(--ink);
    min-height: 100vh;
  }

  /* ======================================================================
   * C — SAGE & CHARCOAL
   * Muted off-white background, charcoal ink, sage green accent.
   * Calm, contemporary. IBM Plex Serif.
   * ====================================================================== */
  .alt-c {
    background: #f2efe5;
    --paper: #f2efe5;
    --ink: #1f201c;
    --ink-soft: #353631;
    --ink-mute: rgba(31,32,28,0.55);
    --rule: rgba(31,32,28,0.18);
    --rule-soft: rgba(31,32,28,0.08);
    --accent: #4a6b48;
    --live: #b08a3a;
    --card: #fafaf3;
    --tag-bg: rgba(74,107,72,0.13);
    --tag-fg: #38522e;
    --today-bg: rgba(74,107,72,0.05);
    --display: 'IBM Plex Serif', Georgia, serif;
    --body: 'IBM Plex Serif', Georgia, serif;
    --mono: 'IBM Plex Mono', 'DM Mono', monospace;
    color: var(--ink);
    min-height: 100vh;
  }

  /* ======================================================================
   * D — HIGH-CONTRAST MONOCHROME
   * Pure white, dramatic black, one mustard accent. Bauhaus-y. Inter
   * everywhere, no serifs. Sharp.
   * ====================================================================== */
  .alt-d {
    background: #ffffff;
    --paper: #ffffff;
    --ink: #000000;
    --ink-soft: #1a1a1a;
    --ink-mute: rgba(0,0,0,0.55);
    --rule: rgba(0,0,0,0.18);
    --rule-soft: rgba(0,0,0,0.08);
    --accent: #d4a017;
    --live: #2e8b57;
    --card: #f7f7f5;
    --tag-bg: rgba(212,160,23,0.18);
    --tag-fg: #8b6914;
    --today-bg: rgba(212,160,23,0.06);
    --display: 'Inter', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'DM Mono', monospace;
    color: var(--ink);
    min-height: 100vh;
  }
  .alt-d .intro h1 { font-weight: 600; letter-spacing: -0.03em; }
  .alt-d .day .date .dom { font-weight: 600; letter-spacing: -0.04em; }
  .alt-d .section-head h2 { font-weight: 600; letter-spacing: -0.02em; }
  .alt-d .now .who { font-weight: 600; }
  .alt-d .glance .v { font-weight: 600; letter-spacing: -0.02em; }
</style>
</head>
<body>

<div class="demo-bar">
  <h1>palette variants</h1>
  <button class="active" data-show="a">A · ink & vermillion</button>
  <button data-show="b">B · library blue</button>
  <button data-show="c">C · sage & charcoal</button>
  <button data-show="d">D · mono + mustard</button>
  <span class="meta">same journal layout · 4 palettes · pick a direction</span>
</div>

<!-- ============================ Body template repeated per variant ============================ -->

<script type="text/template" id="tpl">
  <div class="page">
    <header class="masthead">
      <div class="l"><span class="pulse"></span>az önce senkron</div>
      <div class="m"><b>Tarih Vakfı</b> · Sayım Defteri</div>
      <div class="r">Hafta XLVII · 7–13 Mayıs</div>
    </header>

    <section class="intro">
      <p class="label">Pertev Naili Boratav Arşivi</p>
      <h1>Bu hafta arşivde<br><em>ne yapıldı?</em></h1>
      <p class="lede">Yedi günün kaydı, sıralı. <b>88 kutu</b>, 21 isim, 77.544 sayfa — bu hafta <b>172 kayıt</b> düştü ve <b>İstanbul yazışmaları</b> tamamlandı.</p>
    </section>

    <article class="now">
      <span class="badge">Şu an</span>
      <div class="av">S</div>
      <div>
        <p class="who"><em>Sibel-Lara</em> Kutu 16'da</p>
        <p class="what">saha defterlerini tarıyor · öğleden beri arşivde</p>
      </div>
      <div class="pages">+21<small>Bugün</small></div>
    </article>

    <section class="glance">
      <div>
        <p class="lbl">Haftanın ritmi</p>
        <p class="v"><em>172</em><small>kayıt</small></p>
        <div class="spark">
          <span class="b" style="height:11%"></span>
          <span class="b" style="height:8%"></span>
          <span class="b quiet" style="height:5%"></span>
          <span class="b quiet" style="height:5%"></span>
          <span class="b" style="height:24%"></span>
          <span class="b" style="height:60%"></span>
          <span class="b today" style="height:62%"></span>
        </div>
      </div>
      <div>
        <p class="lbl">İlerleme</p>
        <p class="v"><em>%2,3</em></p>
        <p class="f">1.808 / 77.544</p>
      </div>
      <div>
        <p class="lbl">Açılmış kutu</p>
        <p class="v">86<small>/ 104</small></p>
        <p class="f">18 sırada</p>
      </div>
      <div>
        <p class="lbl">Aktif</p>
        <p class="v">7<small>kişi</small></p>
        <p class="f">son 30 gün</p>
      </div>
    </section>

    <header class="section-head">
      <h2>Haftanın <em>günlüğü</em></h2>
      <p class="tag">7 gün · son giriş bugün 14:22</p>
    </header>

    <section class="days">

      <article class="day today">
        <div class="date">
          <div class="dn">Çarşamba</div>
          <div class="dom">13</div>
          <div class="stats"><b>+105</b> sayfa<br><b>4</b> gönüllü</div>
        </div>
        <div class="body">
          <p><em class="name">Sibel-Lara</em> <span class="tag">Kutu 16</span> açtı; gün toplamı <span class="delta">+21</span>. <em class="name">Betül</em> <span class="tag">Kutu 14</span> mektupları <span class="delta">(+28)</span>, <em class="name">Ateş</em> <span class="tag">Kutu 15</span> ders notları <span class="delta">(+12)</span>, <em class="name">Seda</em> fotoğraflar <span class="delta">(+44)</span>.</p>
        </div>
      </article>

      <article class="day">
        <div class="date">
          <div class="dn">Salı</div>
          <div class="dom">12</div>
          <div class="stats"><b>+101</b> sayfa<br><b>3</b> gönüllü</div>
        </div>
        <div class="body">
          <p><em class="name">Mert</em> <span class="tag">Kutu 22</span> fotoğraflarına döndü <span class="delta">(+18)</span>. <em class="name">Zeynep</em> <span class="tag">Kutu 31</span> yazışmalarında <span class="delta">+62 sayfa</span>. <em class="name">Deniz</em> Kutu 68 müsveddelerinde <span class="delta">(+21)</span>.</p>
        </div>
      </article>

      <article class="day">
        <div class="date">
          <div class="dn">Pazartesi</div>
          <div class="dom">11</div>
          <div class="stats"><b>+40</b> sayfa<br><b>1</b> gönüllü</div>
        </div>
        <div class="body">
          <p>Hafta sessiz başladı. <em class="name">Aysu</em> <span class="tag">Kutu I·2</span> açtı, gün sonunda <span class="delta">+40 sayfa</span>.</p>
        </div>
      </article>

      <article class="day quiet">
        <div class="date">
          <div class="dn">Pazar</div>
          <div class="dom">10</div>
          <div class="stats">—</div>
        </div>
        <div class="body"><p>Arşiv kapalı.</p></div>
      </article>

      <article class="day quiet">
        <div class="date">
          <div class="dn">Cumartesi</div>
          <div class="dom">09</div>
          <div class="stats">—</div>
        </div>
        <div class="body"><p>Arşiv kapalı.</p></div>
      </article>

      <article class="day">
        <div class="date">
          <div class="dn">Cuma</div>
          <div class="dom">08</div>
          <div class="stats"><b>+13</b> sayfa<br><b>3</b> gönüllü</div>
        </div>
        <div class="body">
          <p>Üç gönüllü öğleden sonra geldi — <em class="name">Burak</em>, <em class="name">Hülya</em>, <em class="name">Selin</em>. <span class="tag">Kutu 16</span> için ön sayım yapıldı.</p>
        </div>
      </article>

      <article class="day">
        <div class="date">
          <div class="dn">Perşembe</div>
          <div class="dom">07</div>
          <div class="stats"><b>+18</b> sayfa<br><b>tamam ✓</b></div>
        </div>
        <div class="body">
          <p><em class="name">Cem</em> <span class="tag">Kutu I·1</span>'in son sayfalarını tamamladı. İstanbul yazışmaları artık <span class="delta">%100 tamamlandı</span> — 149 sayfanın hepsi dijital.</p>
        </div>
      </article>

    </section>

    <footer class="colophon">
      <p>Sayfa saatte bir, paylaşılan Google Sheet'ten tazeleniyor.</p>
      <p><a href="mailto:tarihvakfi@tarihvakfi.org.tr">Gönüllü olmak ister misin?</a></p>
      <p class="signoff">Tarih Vakfı · 1991 · Eminönü, İstanbul</p>
    </footer>
  </div>
</script>

<section class="demo alt-a active"></section>
<section class="demo alt-b"></section>
<section class="demo alt-c"></section>
<section class="demo alt-d"></section>

<script>
  const tpl = document.getElementById('tpl').innerHTML;
  document.querySelectorAll('.demo').forEach(d => d.innerHTML = tpl);

  document.querySelectorAll('.demo-bar button[data-show]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.demo-bar button[data-show]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.demo').forEach(d => d.classList.remove('active'));
      document.querySelector('.alt-' + btn.dataset.show).classList.add('active');
      window.scrollTo({ top: 0 });
    });
  });
</script>

</body>
</html>
