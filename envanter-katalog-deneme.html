<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Envanter Kataloğu · DENEME</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
<style>
  :root{
    --bordo:#601040; --krem:#fbf7f1; --kagit:#fffdf8; --murekkep:#211a1d;
    --soluk:#74686e; --cizgi:#e8dbe2; --vurgu-bg:#fbf2f7;
    --yesil:#2e6440; --sari:#a06a12; --kirmizi:#9c2233; --mavi:#2a5b86;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--krem);color:var(--murekkep);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
  .gizli{display:none!important}

  .ust{background:var(--bordo);color:#fff;padding:11px 18px;display:flex;align-items:center;
    gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  .ust h1{font-size:17px;margin:0;font-weight:700}
  .ust .sag{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px}
  .ust button{background:#ffffff26;border:1px solid #ffffff4d;color:#fff;border-radius:7px;
    padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}

  .sayfa{max-width:1180px;margin:0 auto;padding:18px}
  .kart{background:var(--kagit);border:1px solid var(--cizgi);border-radius:12px;padding:20px}
  .giris{max-width:420px;margin:60px auto}
  h2{font-size:20px;margin:0 0 4px;color:var(--bordo)}
  .ipucu{color:var(--soluk);font-size:14px;margin:0 0 16px}
  label{display:block;font-weight:600;font-size:12.5px;margin:14px 0 5px;color:var(--soluk);
    text-transform:uppercase;letter-spacing:.05em}
  input,select{width:100%;padding:11px 12px;border:1.5px solid var(--cizgi);border-radius:9px;
    font:inherit;font-size:16px;background:#fff;color:var(--murekkep)}
  input:focus,select:focus{outline:2px solid var(--bordo);outline-offset:1px;border-color:transparent}
  .btn{padding:12px 18px;border:none;border-radius:10px;background:var(--bordo);color:#fff;
    font:inherit;font-size:16px;font-weight:700;cursor:pointer}
  .btn.genis{width:100%;margin-top:16px}
  .btn.ikincil{background:#fff;color:var(--murekkep);border:1.5px solid var(--cizgi);font-weight:500}
  .btn:disabled{opacity:.5;cursor:default}

  /* süzgeçler */
  .suzgec{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end;
    background:var(--kagit);border:1px solid var(--cizgi);border-radius:12px;padding:14px 16px}
  .suzgec label{margin-top:0}
  .suzgec .alan{min-width:0}
  @media (max-width:760px){ .suzgec{grid-template-columns:1fr 1fr} }

  .durum{margin:14px 2px;color:var(--soluk);font-size:14px}
  .durum b{color:var(--murekkep);font-size:16px}

  /* kartlar */
  .izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px}
  .kitap{background:var(--kagit);border:1px solid var(--cizgi);border-radius:11px;overflow:hidden;
    display:flex;flex-direction:column;border-top:4px solid var(--cizgi)}
  .ykIpucu{cursor:help;border-bottom:1px dotted #c9a7b8}
  .kartIslem{display:flex;gap:8px;margin-top:8px;padding-top:8px;
             border-top:1px solid #efe7e2}
  .kartIslem button{flex:1;padding:7px 0;border-radius:7px;font-size:12.5px;
      font-weight:700;cursor:pointer;background:#fff;border:1.5px solid}
  .kDuzelt{border-color:var(--bordo);color:var(--bordo)}
  .kSil{border-color:#9c2233;color:#9c2233}
  .kartDuzenle{padding:10px 12px 12px;border-top:1.5px dashed var(--cizgi);
               background:#fbf7f1;display:grid;gap:7px}
  .kartDuzenle input,.kartDuzenle textarea{width:100%;font-size:13.5px;
      padding:7px 9px;border:1.5px solid var(--cizgi);border-radius:7px;font-family:inherit}
  .kartDuzenle label{font-size:11px;font-weight:700;color:#74686e;
      text-transform:uppercase;letter-spacing:.4px;margin-bottom:-4px}
  .kartDuzenle .dSatir{display:flex;gap:8px}
  .kartDuzenle .dSatir button{flex:1;padding:9px 0;border:none;border-radius:8px;
      font-weight:700;cursor:pointer;font-size:13.5px}
  .kartDuzenle .dKaydet{background:var(--bordo);color:#fff}
  .kartDuzenle .dVazgec{background:#e8dcd4;color:#5a4a52}

  .kitap.gidecek{border-top-color:var(--yesil)} .kitap.belki{border-top-color:var(--sari)}
  .kitap.gitmeyecek{border-top-color:var(--kirmizi)} .kitap.belirsiz{border-top-color:var(--mavi)}
  .kitap .resim{display:block;height:190px;background:#2a2226;position:relative}
  .kitap .resim img{width:100%;height:100%;object-fit:cover;display:block}
  .kitap .resim .yok{color:#e8dbe2;font-size:12.5px;display:flex;align-items:center;
    justify-content:center;height:100%;text-align:center;padding:10px}
  .kitap .resim .rozet{position:absolute;left:7px;top:7px;background:#000000a6;color:#fff;
    font-size:10.5px;padding:2px 7px;border-radius:20px;letter-spacing:.03em}
  .kitap .govde{padding:11px 12px 13px;flex:1;display:flex;flex-direction:column;gap:3px}
  .kitap .bas{font-weight:700;font-size:14.5px;line-height:1.25}
  .kitap .yaz{color:var(--soluk);font-size:13px}
  .kitap .alt{margin-top:auto;padding-top:8px;display:flex;gap:8px;align-items:center;
    font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--bordo)}
  .kitap .alt .kat{margin-left:auto;font-family:inherit;font-size:11px;color:var(--soluk)}

  .nerede{display:inline-flex;align-items:center;gap:6px;border-radius:6px;
    padding:2px 8px;font-size:11.5px;font-weight:800;letter-spacing:.3px;margin:6px 0 2px}
  .nerede b{font-weight:800;font-family:'DejaVu Sans Mono',ui-monospace,monospace}
  .nerede.depo{background:#efe6f3;color:#5a2a63}
  .nerede.yeni{background:#e4f0e7;color:#22502f}
  .nerede.raf{background:#f0eae6;color:#6b5c63}

  .kutula{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px;
    background:#fdf6f0;border:1.5px solid #e0cdbb;border-radius:10px;padding:12px 14px}
  .kutula label{font-size:13px;font-weight:700;color:var(--bordo)}
  .kutula input{width:90px;padding:8px 10px;border:1.5px solid var(--cizgi);
    border-radius:8px;font:inherit;font-size:15px}
  .kutula .hedef button{border:1.5px solid var(--cizgi);background:#fff;border-radius:8px;
    padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;margin-right:6px}
  .kutula .hedef button.sec{border-color:var(--bordo);background:var(--bordo);color:#fff;
    font-weight:700}

  .ayikla{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 16px;
          background:#fdf0e6;border:1.5px solid var(--bordo);border-radius:10px;
          padding:11px 14px;font-size:14.5px}
  .ayikla button{margin-left:auto}
  .msg{padding:12px 14px;border-radius:9px;font-size:14.5px;margin:0 0 14px;display:none;border:1px solid}
  .msg.gor{display:block}
  .msg.hata{background:#fdf2f4;color:#8a1230;border-color:#f0cdd6}
  .msg.bos{background:var(--vurgu-bg);color:var(--bordo);border-color:var(--cizgi)}
  .donen{display:inline-block;width:14px;height:14px;border:2px solid #ffffff59;border-top-color:#fff;
    border-radius:50%;animation:don .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes don{to{transform:rotate(360deg)}}
  .orta{text-align:center;margin:22px 0}
</style>
</head>
<body>

<div class="ust gizli" id="ust">
  <h1>Envanter Kataloğu</h1>
  <div class="sag">
    <span id="ustSayi"></span>
    <button id="btnCsv">CSV indir</button>
    <button id="btnCikis">Çıkış</button>
  </div>
</div>

<div class="sayfa">
  <section id="adim-giris" class="kart giris">
    <h2>Envanter Kataloğu</h2>
    <p class="ipucu">Kaydedilmiş kitapları fotoğraflarıyla birlikte gösterir.</p>
    <div class="msg" id="msgGiris"></div>
    <label for="ad">Adınız</label>
    <input type="text" id="ad" placeholder="Ad Soyad" autocomplete="name">
    <label for="sifre">Koordinatör şifresi</label>
    <input type="text" id="sifre" placeholder="Gönüllülerinkinden farklı" autocapitalize="none" autocorrect="off">
    <button class="btn genis" id="btnGiris">Aç</button>
  </section>

  <section id="adim-liste" class="gizli">
    <div class="suzgec">
      <div class="alan">
        <label for="ara">Ara</label>
        <input type="search" id="ara" placeholder="Başlık, yazar, yer kodu, kutu no…">
      </div>
      <div class="alan">
        <label for="kategori">Karar</label>
        <select id="kategori"></select>
      </div>
      <div class="alan">
        <label for="sirala">Sıralama</label>
        <select id="sirala">
          <option value="yeni">En yeni kayıt önce</option>
          <option value="yer">Yer koduna göre</option>
        </select>
      </div>
      <div class="alan">
        <label for="kapsam">Kapsam</label>
        <select id="kapsam">
          <option value="onayli">Yalnızca onaylananlar</option>
          <option value="hepsi">Tüm kayıtlar</option>
        </select>
      </div>
      <div class="alan">
        <label for="siraSuz">Sıra</label>
        <select id="siraSuz"><option value="">hepsi</option></select>
      </div>
      <div class="alan">
        <label for="kutuSuz">Kutu</label>
        <select id="kutuSuz"><option value="">hepsi</option></select>
      </div>
    </div>

    <div class="kutula gizli" id="kutulaSerit">
      <label for="kutuNo2">Yeni binaya kutula →</label>
      <span class="hedef" id="kutuHedef">
        <button type="button" data-hedef="yeni" class="sec">Yeni bina</button>
        <button type="button" data-hedef="depo" title="Yalnızca depoda kalan kitaplar başka bir yere taşınıyorsa">Depo taşınıyor</button>
      </span>
      <input type="text" id="kutuNo2" inputmode="numeric" maxlength="4" placeholder="kutu no">
      <button class="btn ikincil" id="btnKutula" style="margin-left:auto">Kutuyu kapat</button>
    </div>

    <div class="ayikla gizli" id="ayiklaSerit">
      <span id="ayiklaMetin"></span>
      <button class="btn ikincil" id="btnAyiklaListe">Çekme listesini yazdır</button>
    </div>

    <div class="msg" id="msg"></div>
    <p class="durum" id="durum"></p>
    <div class="izgara" id="izgara"></div>
    <div class="orta">
      <button class="btn ikincil gizli" id="btnDaha">Daha fazla göster</button>
    </div>
  </section>
</div>

<script src="./js/gonullu-config.js?v=20260818"></script>

<script>
/* ══════════════ DENEME ARKA UCU ══════════════
   Bu sayfa Google'a hiç bağlanmaz. İstekler burada karşılanır, kayıtlar
   yalnızca bu telefonun hafızasında durur. Gerçek sayfa: kitap-envanteri.html */
(function () {
  'use strict';
  window.TV_ENVANTER_URL = 'https://deneme.yerel/exec';
  var DEPO = 'tv_demo_veri';
  var SIFRE = 'deneme';
  var KOORD_SIFRE = 'koordinator';
  var KOORDINATOR_EYLEMLERI = ['onayBekleyen', 'onayGruplari', 'onayla', 'topluOnayla',
                               'kararBekleyen', 'kararVer',
                               'katalog', 'durum', 'siraHaritasi', 'kutula', 'kutular'];
  var SINIFLANDIRILMADI = 'Sınıflandırılmadı';

  /* Karar önerisi — canlı sunucudakinin sadeleştirilmiş kopyası. */
  var sadeMetin = function (b) {
    return String(b == null ? '' : b)
      .replace(/[İIıi]/g, 'i').replace(/[Ğğ]/g, 'g').replace(/[Şş]/g, 's')
      .replace(/[Öö]/g, 'o').replace(/[Üü]/g, 'u').replace(/[Çç]/g, 'c').toLowerCase();
  };
  var ONERILER = [
    { kural:'Y1', guven:'yuksek', sebep:'Tarih Vakfı yayını', kalip:/(tarih vakfi)/ },
    { kural:'Y5', guven:'yuksek', sebep:'Rapor / tez / bülten',
      kalip:/(\brapor\b|raporu\b|\btez\b|tezi\b|bulten)/ },
    { kural:'K1', guven:'yuksek', sebep:'Ders / sınav kitabı',
      kalip:/(ders kitabi|soru bankasi|konu anlatimli|\boss\b|\byks\b|\bkpss\b)/ },
    { kural:'K2', guven:'orta', sebep:'Mevzuat / yıllık',
      kalip:/(mevzuat|yillik\b|yilligi\b|almanak)/ },
    { kural:'Y2', guven:'orta', sebep:'Alan içi: toplumsal / kent tarihi',
      kalip:/(osmanli|cumhuriyet|kent tarihi|sozlu tarih|bellek|arsiv)/ },
    { kural:'S2', guven:'orta', sebep:'Genel başvuru kaynağı',
      kalip:/(ansiklopedi|sozluk|sozlugu|el kitabi|rehber\b)/ },
  ];
  var kuralKategorisi = function (kod) {
    for (var i = 0; i < KURALLAR.length; i++) if (KURALLAR[i][0] === kod) return KURALLAR[i][1];
    return '';
  };
  var kuralAciklamasi = function (kod) {
    for (var i = 0; i < KURALLAR.length; i++) if (KURALLAR[i][0] === kod) return KURALLAR[i][2];
    return '';
  };
  var kararOner = function (k) {
    var yil = Number(k.yil) || 0, nusha = Number(k.nusha) || 1;
    if (nusha > 3) return { kural:'K3', kategori:'gitmeyecek', guven:'yuksek',
      sebep: nusha + ' nüsha — üçten fazlasının fazlası' };
    if (nusha === 2 || nusha === 3) return { kural:'S1', kategori:'belki', guven:'yuksek',
      sebep: nusha + ' nüsha — ikinci/üçüncü kopya' };
    if (yil && yil < 1950) return { kural:'Y4', kategori:'gidecek', guven:'yuksek',
      sebep: yil + ' baskısı — 1950 öncesi' };
    var havuz = sadeMetin([k.baslik, k.yazar, k.oneriBaslik, k.not].join(' | '));
    for (var i = 0; i < ONERILER.length; i++) {
      if (ONERILER[i].kalip.test(havuz)) {
        return { kural:ONERILER[i].kural, kategori:kuralKategorisi(ONERILER[i].kural),
                 guven:ONERILER[i].guven, sebep:ONERILER[i].sebep };
      }
    }
    if (k.durum === 'Küflü/böcekli') return { kural:'K4', kategori:'gitmeyecek',
      guven:'dusuk', sebep:'Küflü/böcekli işaretlenmiş' };
    return { kural:'', kategori:'', guven:'', sebep:'' };
  };
  var oneriEkle = function (k) {
    var o = kararOner(k);
    var y = {}; for (var a in k) y[a] = k[a];
    y.oneriKural = o.kural; y.oneriKategori = o.kategori;
    y.oneriGuven = o.guven; y.oneriSebep = o.sebep;
    return y;
  };
  var agKapali = false;

  var KATEGORILER = {
    gidecek:   { ad: 'Gidecek' },      belki:     { ad: 'Gitse de olur' },
    gitmeyecek:{ ad: 'Gitmeyecek' },   belirsiz:  { ad: 'Belirsiz' }
  };
  var DURUMLAR = ['Sağlam', 'Yıpranmış', 'Küflü/böcekli'];
  var KURALLAR = [
    ['Y1','gidecek','Tarih Vakfı yayınları ve vakıf tarihine ait her şey'],
    ['Y2','gidecek','Türkiye ekonomik/toplumsal tarihi, kent tarihi, sözlü tarih'],
    ['Y3','gidecek','İmzalı, ithaflı veya ex-libris’li nüsha'],
    ['Y4','gidecek','1950 öncesi baskı; Osmanlıca / eski harfli eser'],
    ['Y5','gidecek','Rapor, tez, bülten, katalog, broşür'],
    ['Y6','gidecek','Süreli yayının tam serisi'],
    ['Y7','gidecek','Şartlı bağış koleksiyonunun parçası'],
    ['S1','belki','İkinci veya üçüncü kopya'],
    ['S2','belki','Genel başvuru kaynağı'],
    ['S3','belki','Dolaylı ilgili, yabancı dilde'],
    ['S4','belki','Güncelliğini kısmen yitirmiş'],
    ['S5','belki','Sağlam ama önceliği düşük'],
    ['K1','gitmeyecek','Alan dışı: ders/sınav kitabı, popüler kurgu'],
    ['K2','gitmeyecek','Güncelliğini yitirmiş mevzuat, yıllık/katalog fazlası'],
    ['K3','gitmeyecek','Üçten fazla mükerrer nüshanın fazlası'],
    ['K4','gitmeyecek','Ağır hasarlı ve kolay bulunabilir'],
    ['K5','gitmeyecek','Süreli yayının dağınık tek sayısı'],
    ['K6','gitmeyecek','Tanıtım/promosyon malzemesi'],
    ['Y0','gidecek','Elle karar: gitsin (tek tık)'],
    ['S0','belki','Elle karar: gitse de olur (tek tık)'],
    ['K0','gitmeyecek','Elle karar: kalsın (tek tık)'],
    ['M0','belirsiz','Elle karar: belirsiz (tek tık)'],
    ['M1','belirsiz','On saniyede karar veremedim'],
    ['M2','belirsiz','Değerli olabilir şüphesi'],
    ['M3','belirsiz','Yabancı dilde, içeriği anlamadım'],
    ['M4','belirsiz','Kurallar çelişiyor']
  ];
  var MEKANLAR = [{ kod:'G', ad:'Giriş Kat' }, { kod:'U', ad:'Üst Kat' },
                  { kod:'X', ad:'Diğer', rafSayisi:6 }];
  var RAF_HARFLERI = (function () {           // A..Z, AA.. — 60 raf
    var d = [], i, j;
    for (i = 0; i < 60; i++) {
      var ad = '', n = i;
      do { ad = String.fromCharCode(65 + (n % 26)) + ad; n = Math.floor(n / 26) - 1; }
      while (n >= 0);
      d.push(ad);
    }
    return d;
  })();
  var SIRA_SAYISI = 6;
  function mekanRaflari(m) {
    return (m && Number(m.rafSayisi)) ? RAF_HARFLERI.slice(0, Number(m.rafSayisi)) : RAF_HARFLERI;
  }

  function oku() {
    try { return JSON.parse(localStorage.getItem(DEPO) || '{}'); } catch (h) { return {}; }
  }
  function yaz(v) { try { localStorage.setItem(DEPO, JSON.stringify(v)); } catch (h) {} }
  function veri() {
    var v = oku();
    if (!v.kayitlar) v.kayitlar = [];
    if (!v.sonraki) v.sonraki = 1;
    if (!v.fotolar) v.fotolar = {};
    return v;
  }
  function pad(n, h) { var m = String(n); while (m.length < h) m = '0' + m; return m; }
  function anahtar(m, r, s) { return (m ? m + '-' : '') + String(r || '').toUpperCase() + pad(Number(s) || 0, 2); }

  function islet(g) {
    var v = veri(), i;
    if (g.action === 'config') {
      return { ok:true, org:'Tarih Vakfı (DENEME)', kategoriler:KATEGORILER, durumlar:DURUMLAR,
        siniflandirilmadi: SINIFLANDIRILMADI,
        kurallar: KURALLAR.map(function (k) { return { kod:k[0], kategori:k[1], aciklama:k[2] }; }),
        mekanlar: MEKANLAR, rafHarfleri: RAF_HARFLERI, siraSayisi: SIRA_SAYISI };
    }
    if (KOORDINATOR_EYLEMLERI.indexOf(g.action) >= 0) {
      if (String(g.sifre || '') !== KOORD_SIFRE) {
        return { ok:false, sifreHatasi:true,
          error:'Bu ekran koordinatör şifresi ister. (Denemede: koordinator)' };
      }
    } else if (String(g.sifre || '') !== SIFRE) {
      return { ok:false, error:'Çalışma şifresi hatalı. (Denemede şifre: deneme)', sifreHatasi:true };
    }
    if (g.action === 'sayac') {
      var ad = String(g.kaydeden || '').toLowerCase();
      return { ok:true, toplam: v.kayitlar.length, bugun: v.kayitlar.length,
        benim: v.kayitlar.filter(function (k) { return String(k.kaydeden).toLowerCase() === ad; }).length };
    }
    if (g.action === 'rafDurum') {
      var a = anahtar(g.mekan, g.raf, g.sira);
      var ayni = v.kayitlar.filter(function (k) { return k.anahtar === a; });
      var son = ayni.reduce(function (e, k) { return Math.max(e, Number(k.siraNo) || 0); }, 0);
      var bit = (v.siralar || {})[a];
      var sonK = ayni[ayni.length - 1];
      var tutanD = (v.tutulan || {})[a] || '';
      var onSayD = (v.onSayimlar || {})[a];
      return { ok:true, anahtar:a, sonNo:son, adet:ayni.length,
        durum: bit ? 'bitti' : (ayni.length ? 'devam' : 'bos'),
        bitiren: bit ? bit.bitiren : '', bitisTarihi: bit ? bit.tarih : '',
        raftaki: bit ? bit.raftaki : '',
        tutulu: !!tutanD, tutan: tutanD,
        onSayim: onSayD ? onSayD.adet : null,
        sonCalisan: sonK ? sonK.kaydeden : '',
        sonTarih: sonK ? String(sonK.tarih || '').slice(0, 10) : '',

        if (!kk) { atlananV.push({ no:no, neden:'bulunamadı' }); return; }
        if (!kk.onay) { atlananV.push({ no:no, neden:'künyesi onaylanmamış' }); return; }
        var katK = String(kk.kategori || '').trim();
        if (katK && katK !== SINIFLANDIRILMADI && !g.uzerineYaz) {
          atlananV.push({ no:no, neden:'kararı verilmiş: ' + katK }); return;
        }
        kk.kategori = KATEGORILER[g.kategori].ad; kk.kural = kuralV;
        yazilanV.push(no);
      });
      yaz(v);
      return { ok:true, yazilan:yazilanV, atlanan:atlananV,
               kategori:KATEGORILER[g.kategori].ad, kural:kuralV };
    }
    if (g.action === 'onayla') {
      for (i = 0; i < v.kayitlar.length; i++) if (v.kayitlar[i].no === Number(g.no)) {
        var y = g.kayit || {};
        if (!String(y.baslik || '').trim()) return { ok:false, error:'Başlık boş olamaz.' };
        if (y.yalnizKunye) {
          // İki aşamalı akışın 1. adımı: künye damgalanır, karar sonraya kalır.
          v.kayitlar[i].baslik = y.baslik; v.kayitlar[i].yazar = y.yazar || '';
          v.kayitlar[i].yil = y.yil || ''; v.kayitlar[i].not = y.not || '';
          v.kayitlar[i].onay = 'Künye onaylı — ' + (y.onaylayan || '');
          yaz(v); return { ok:true, no:Number(g.no), yalnizKunye:true };
        }
        if (!KATEGORILER[y.kategori]) return { ok:false, error:'Karar seçilmeli.' };
        if (!KURALLAR.some(function (r) { return r[0] === y.kural && r[1] === y.kategori; })) {
          return { ok:false, error:'Kural kodu bu karara uymuyor.' };
        }
        v.kayitlar[i].baslik = y.baslik; v.kayitlar[i].yazar = y.yazar || '';
        v.kayitlar[i].yil = y.yil || ''; v.kayitlar[i].not = y.not || '';
        v.kayitlar[i].kategori = KATEGORILER[y.kategori].ad; v.kayitlar[i].kural = y.kural;
        v.kayitlar[i].onay = 'Onaylandı — ' + (y.onaylayan || '');
        yaz(v); return { ok:true, no:Number(g.no) };
      }
      return { ok:false, error:'Kayıt bulunamadı.' };
    }
    return { ok:false, error:'Bilinmeyen istek.' };
  }

  var gercekFetch = window.fetch.bind(window);
  window.fetch = function (adres, ayar) {
    if (String(adres).indexOf('deneme.yerel') < 0) return gercekFetch(adres, ayar);
    return new Promise(function (tamam, hata) {
      setTimeout(function () {
        if (agKapali) return hata(new TypeError('deneme: ağ kapalı'));
        var g = {};
        try { g = JSON.parse((ayar && ayar.body) || '{}'); } catch (h) {}
        var sonuc;
        try { sonuc = islet(g); } catch (h) { sonuc = { ok:false, error:'deneme hatası: ' + h.message }; }
        tamam({ ok:true, text: function () { return Promise.resolve(JSON.stringify(sonuc)); } });
      }, 250);
    });
  };

  /* ── deneme şeridi ── */
  document.addEventListener('DOMContentLoaded', function () {
    var s = document.createElement('div');
    s.id = 'demoSerit';
    s.innerHTML =
      '<div class="demo-ust"><b>DENEME MODU</b> — kayıtlar yalnızca bu telefonda, ' +
      'Google\'a hiçbir şey gitmiyor. Şifreler: gönüllü <b>deneme</b>, koordinatör ' +
      '<b>koordinator</b></div>' +
      '<div class="demo-dugmeler">' +
        '<button type="button" id="demoAg">İnterneti kes</button>' +
        '<button type="button" id="demoSil">Deneme kayıtlarını sil</button>' +
      '</div>';
    document.body.insertBefore(s, document.body.firstChild);

    var d = document.getElementById('demoAg');
    d.addEventListener('click', function () {
      agKapali = !agKapali;
      d.textContent = agKapali ? 'İnterneti aç' : 'İnterneti kes';
      d.className = agKapali ? 'kapali' : '';
      s.className = agKapali ? 'kesik' : '';
    });
    document.getElementById('demoSil').addEventListener('click', function () {
      if (!confirm('Deneme kayıtlarının hepsi silinsin mi?')) return;
      localStorage.removeItem(DEPO);
      localStorage.removeItem('tv_env_kuyruk');
      localStorage.removeItem('tv_env_foto_kuyruk');
      localStorage.removeItem('tv_env_sira');
      localStorage.removeItem('tv_env_devir');
      location.reload();
    });
  });
})();
</script>
<style>
  #demoSerit{background:#1f2937;color:#fff;padding:8px 12px;font:14px/1.4 system-ui,sans-serif;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #demoSerit.kesik{background:#92400e}
  #demoSerit .demo-ust{flex:1;min-width:200px;font-size:12.5px;opacity:.95}
  #demoSerit .demo-dugmeler{display:flex;gap:8px;margin-left:auto}
  #demoSerit button{background:#ffffff26;border:1px solid #ffffff59;color:#fff;border-radius:7px;
    padding:7px 11px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  #demoSerit button.kapali{background:#fbbf24;border-color:#fbbf24;color:#3b2600;font-weight:700}
  /* denemede Drive bağlantısı anlamsız */
  #fotoBag{display:none!important}
</style>

<script>
var ENVANTER_URL = window.TV_ENVANTER_URL || 'BURAYA_APPS_SCRIPT_ADRESINI_YAPISTIRIN';

(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var D = { ad: '', sifre: '', kayitlar: [], toplam: 0, bas: 0, istekNo: 0 };
  var ADET = 60;

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  function goster(el, sinif, metin) { el.className = 'msg ' + sinif + ' gor'; el.innerHTML = metin; }
  function gizle(el) { el.className = 'msg'; }
  function mesgul(b, acik, metin) {
    if (acik) { b.dataset.eski = b.innerHTML; b.innerHTML = '<span class="donen"></span>' + (metin || '…'); b.disabled = true; }
    else { b.innerHTML = b.dataset.eski || b.innerHTML; b.disabled = false; }
  }

  /* Apps Script uykudan kalkarken ilk istek 20–30 saniye sürebiliyor; zayıf bağlantıda
     istek büsbütün düşebiliyor. Okuma istekleri otomatik tekrar denenir, yazma istekleri
     (onayla) denenmez — aynı kayıt iki kez işlenmesin. */
  var TEKRARLANABILIR = ['config', 'onayBekleyen', 'katalog', 'durum'];

  function tekIstek(action, yuk, sure) {
    var govde = { action: action, sifre: D.sifre };
    for (var k in (yuk || {})) govde[k] = yuk[k];
    var kes = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var saat = setTimeout(function () { if (kes) kes.abort(); }, sure);
    var bitir = function () { clearTimeout(saat); };
    return fetch(ENVANTER_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(govde), redirect: 'follow', signal: kes ? kes.signal : undefined
    }).catch(function () { bitir(); throw new Error('AĞ'); })
      .then(function (r) { bitir(); return r.text(); })
      .then(function (m) {
        var d;
        try { d = JSON.parse(m); } catch (h) {
          /* JSON yerine HTML geldiyse istek sunucuya ulaşıyor ama Apps Script yanıt
             vermiyor demektir. En sık sebebi dağıtımın erişim ayarıdır: yeni
             dağıtımlarda varsayılan "Yalnızca kendim"dir ve Google giriş sayfası döner. */
          throw new Error(/^\s*</.test(m)
            ? 'Sunucu JSON yerine web sayfası döndürdü. Apps Script dağıtımında ' +
              '“Erişimi olan: Herkes” seçili mi? (Yeni dağıtımlarda varsayılan “Yalnızca kendim”dir.)'
            : 'Sunucudan beklenmeyen yanıt.');
        }
        if (!d.ok) throw new Error(d.error || 'Hata');
        return d;
      });
  }

  function api(action, yuk) {
    if (/BURAYA_APPS_SCRIPT/.test(ENVANTER_URL)) {
      return Promise.reject(new Error('Sistem adresi tanımlanmamış (TV_ENVANTER_URL).'));
    }
    var kalan = TEKRARLANABILIR.indexOf(action) >= 0 ? 2 : 0;
    function dene(kalanDeneme, bekle) {
      return tekIstek(action, yuk, 30000)['catch'](function (e) {
        if (e.message !== 'AĞ' || kalanDeneme <= 0) throw e;
        return new Promise(function (t) { setTimeout(t, bekle); })
          .then(function () { return dene(kalanDeneme - 1, bekle * 2); });
      });
    }
    return dene(kalan, 1200);
  }

  /* "G-C01-002" fareyle üzerine gelene kendini anlatsın. */
  function yerAciklama(kod) {
    var e = /^([^-]+)-([A-ZÇĞİÖŞÜ]+)(\d+)-(\d+)$/.exec(String(kod || '').trim());
    if (!e) return kod || '';
    var mekanAd = e[1];
    ((D.cfg && D.cfg.mekanlar) || []).forEach(function (m) {
      if (String(m.kod).toUpperCase() === e[1].toUpperCase()) mekanAd = m.ad;
    });
    return kod + ' = ' + mekanAd + ' · ' + e[2] + ' rafı · ' +
           Number(e[3]) + '. sıra · ' + Number(e[4]) + '. kitap';
  }

  function agHata(e) { return e.message === 'AĞ' ? 'Sunucuya ulaşılamadı.' : e.message; }

  /* ───────── giriş ───────── */
  $('btnGiris').addEventListener('click', function () {
    var ad = $('ad').value.trim(), sifre = $('sifre').value.trim();
    if (ad.length < 2) return goster($('msgGiris'), 'hata', 'Adınızı yazın.');
    if (!sifre) return goster($('msgGiris'), 'hata', 'Çalışma şifresini yazın.');
    D.ad = ad; D.sifre = sifre;
    mesgul($('btnGiris'), true, 'Açılıyor…');
    api('config').then(function (cfg) {
      D.cfg = cfg;
      $('kategori').innerHTML = '<option value="">Hepsi</option>' +
        Object.keys(cfg.kategoriler).map(function (a) {
          return '<option value="' + esc(cfg.kategoriler[a].ad) + '">' + esc(cfg.kategoriler[a].ad) + '</option>';
        }).join('');
      return suzgecleriDoldur();
    }).then(function () {
      return yukle(true);
    }).then(function () {
      localStorage.setItem('tv_env_ad', ad);
      localStorage.setItem('tv_env_koord_sifre', sifre);
      gizle($('msgGiris'));
      $('adim-giris').classList.add('gizli');
      $('adim-liste').classList.remove('gizli');
      $('ust').classList.remove('gizli');
    })['catch'](function (e) {
      goster($('msgGiris'), 'hata', agHata(e));
    }).then(function () { mesgul($('btnGiris'), false); });
  });
  $('sifre').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnGiris').click(); });

  $('btnCikis').addEventListener('click', function () {
    localStorage.removeItem('tv_env_koord_sifre');
    location.reload();
  });

  /* ───────── liste ───────── */
  function secenekler() {
    return {
      yalnizOnayli: $('kapsam').value === 'onayli',
      ara: $('ara').value.trim(),
      kategori: $('kategori').value,
      sira: $('siraSuz').value,
      kutu: $('kutuSuz').value,
      sirala: $('sirala').value
    };
  }

  function yukle(bastan) {
    var no = ++D.istekNo;                        // hızlı yazarken eski yanıtlar ekranı bozmasın
    if (bastan) { D.bas = 0; D.kayitlar = []; }
    var y = secenekler();
    y.bas = D.bas; y.adet = ADET;
    $('durum').textContent = 'Yükleniyor…';
    return api('katalog', y).then(function (r) {
      if (no !== D.istekNo) return;
      D.toplam = r.toplam;
      D.kayitlar = D.kayitlar.concat(r.kayitlar);
      D.bas = D.kayitlar.length;
      ciz();
    })['catch'](function (e) {
      if (no !== D.istekNo) return;
      $('durum').textContent = '';
      goster($('msg'), 'hata', agHata(e));
      throw e;
    });
  }

  // Drive küçük resmi açılmazsa kartı boş bırakma; yerine kısa bir not koy.
  window.tvResimHata = function (img) {
    if (img && img.parentNode) img.parentNode.innerHTML = '<div class="yok">fotoğraf açılamadı</div>';
  };

  function resimKutusu(k) {
    // Kapak varsa kapak, yoksa künye sayfası gösterilir.
    var kapakMi = !!(k.kapakId || k.kapakGoruntu);
    var kimlik = kapakMi ? k.kapakId : k.fotoId;
    var dogrudan = kapakMi ? k.kapakGoruntu : k.fotoGoruntu;
    var adres = dogrudan || (kimlik ? 'https://drive.google.com/thumbnail?id=' + kimlik + '&sz=w400' : '');
    var bag = (kapakMi ? k.kapak : k.foto) || '';
    var etiket = kapakMi ? 'kapak' : 'künye';

    if (!adres) {
      return '<div class="resim"><div class="yok">fotoğraf yok</div></div>';
    }
    return '<a class="resim" href="' + esc(bag || '#') + '" target="_blank" rel="noopener">' +
      '<img src="' + esc(adres) + '" alt="" loading="lazy" onerror="tvResimHata(this)">' +
      '<span class="rozet">' + etiket + '</span></a>';
  }

  function ciz() {
    var sinif = { 'Gidecek': 'gidecek', 'Gitse de olur': 'belki',
                  'Gitmeyecek': 'gitmeyecek', 'Belirsiz': 'belirsiz' };
    gizle($('msg'));

    if (!D.kayitlar.length) {
      $('izgara').innerHTML = '';
      $('durum').textContent = '';
      goster($('msg'), 'bos', $('kapsam').value === 'onayli'
        ? 'Bu süzgeçle onaylanmış kayıt yok. “Tüm kayıtlar”ı seçip bakabilirsiniz.'
        : 'Bu süzgeçle kayıt yok.');
      $('btnDaha').classList.add('gizli');
      $('ustSayi').textContent = '';
      return;
    }

    $('izgara').innerHTML = D.kayitlar.map(function (k) {
      var altSatir = [k.yil, k.durum && k.durum !== 'Sağlam' ? k.durum : ''
                     ].filter(Boolean).join(' · ');
      /* Kitap şu an fiziksel olarak nerede?
         Taşınmayan kitap yerinden kımıldamıyor — depo, eski rafların kendisi.
         O yüzden adresi zaten yer kodu; ayrıca kutulanmasına gerek yok.
         Kutu numarası yalnızca RAFTAN ÇIKMIŞ kitapta bulunur. */
      var kutuKod = String(k.kutu || '').trim();
      var yerKod = String(k.yer || '').trim();
      var nerede;
      if (kutuKod) {
        nerede = '<div class="nerede ' + (/^D/i.test(kutuKod) ? 'depo' : 'yeni') + '">' +
          (/^D/i.test(kutuKod) ? 'TAŞINDI' : 'YENİ BİNADA') +
          '<b>' + esc(kutuKod) + '</b></div>';
      } else if (k.kategori === 'Gitmeyecek') {
        nerede = '<div class="nerede depo">DEPODA — yerinde' +
          (yerKod ? '<b>' + esc(yerKod) + '</b>' : '') + '</div>';
      } else {
        nerede = '<div class="nerede raf">RAFTA' +
          (yerKod ? '<b>' + esc(yerKod) + '</b>' : '') + '</div>';
      }
      return '<article class="kitap ' + (sinif[k.kategori] || '') + '" data-no="' + k.no + '">' +
        resimKutusu(k) +
        '<div class="govde">' +
          '<div class="bas">' + esc(k.baslik || '(başlıksız)') + '</div>' +
          (k.yazar ? '<div class="yaz">' + esc(k.yazar) + '</div>' : '') +
          (altSatir ? '<div class="yaz">' + esc(altSatir) + '</div>' : '') +
          nerede +
          '<div class="alt"><span title="' + esc(yerAciklama(k.yer)) + '" class="ykIpucu">' +
            esc(k.yer || ('#' + k.no)) + '</span>' +
            '<span class="kat">' + esc(k.kural || '') + '</span></div>' +
          '<div class="kartIslem">' +
            '<button type="button" class="kDuzelt" data-no="' + k.no + '">Düzenle</button>' +
            '<button type="button" class="kSil" data-no="' + k.no + '">Sil</button>' +
          '</div>' +
        '</div></article>';
    }).join('');

    $('durum').innerHTML = '<b>' + D.kayitlar.length + '</b> / ' + D.toplam + ' kitap gösteriliyor';
    $('ustSayi').textContent = D.toplam + ' kayıt';
    $('btnDaha').classList.toggle('gizli', D.kayitlar.length >= D.toplam);
  }

  /* ── Koordinatör herhangi bir kaydı siler ya da künyesini düzeltir.
     Silme yumuşaktır (Silindi işareti); yanlışlıkla silinen kayıt tablodan
     geri açılabilir. Düzenleme kartın içinde küçük bir formla yapılır —
     ayrı ekrana gitmeye gerek yok. ── */
  $('izgara').addEventListener('click', function (e) {
    var sil = e.target.closest('.kSil');
    if (sil) {
      var no = Number(sil.dataset.no);
      var k = D.kayitlar.filter(function (x) { return x.no === no; })[0] || {};
      if (!window.confirm('#' + no + ' — "' + (k.baslik || 'başlıksız') +
          '" silinsin mi?\n\nKayıt çöpe gitmez, "silindi" olarak işaretlenir.')) return;
      sil.disabled = true; sil.textContent = 'Siliniyor…';
      api('sil', { no: no }).then(function () {
        var kart = sil.closest('.kitap');
        kart.style.opacity = '.35';
        kart.querySelector('.kartIslem').innerHTML =
          '<span style="font-size:12px;color:#9c2233;font-weight:700;padding:6px 0">Silindi</span>';
      })['catch'](function (h) {
        sil.disabled = false; sil.textContent = 'Sil';
        goster($('msg'), 'hata', agHata(h));
      });
      return;
    }

    var duzelt = e.target.closest('.kDuzelt');
    if (duzelt) {
      var kart2 = duzelt.closest('.kitap');
      if (kart2.querySelector('.kartDuzenle')) {           // zaten açık → kapat
        kart2.querySelector('.kartDuzenle').remove(); return;
      }
      var no2 = Number(duzelt.dataset.no);
      var k2 = D.kayitlar.filter(function (x) { return x.no === no2; })[0];
      if (!k2) return;
      var f = document.createElement('div');
      f.className = 'kartDuzenle';
      f.innerHTML =
        '<label>Başlık</label><input class="dBaslik" value="' + esc(k2.baslik || '') + '">' +
        '<label>Yazar</label><input class="dYazar" value="' + esc(k2.yazar || '') + '">' +
        '<div class="dSatir">' +
          '<div style="flex:1"><label>Yıl</label>' +
            '<input class="dYil" inputmode="numeric" maxlength="4" value="' + esc(k2.yil || '') + '"></div>' +
          '<div style="flex:1"><label>Nüsha</label>' +
            '<input class="dNusha" inputmode="numeric" value="' + esc(k2.nusha || 1) + '"></div>' +
        '</div>' +
        '<label>Not</label><textarea class="dNot" rows="2">' + esc(k2.not || '') + '</textarea>' +
        '<div class="dSatir">' +
          '<button type="button" class="dKaydet">Kaydet</button>' +
          '<button type="button" class="dVazgec">Vazgeç</button>' +
        '</div>';
      kart2.appendChild(f);

      f.querySelector('.dVazgec').addEventListener('click', function () { f.remove(); });
      f.querySelector('.dKaydet').addEventListener('click', function () {
        var b = f.querySelector('.dKaydet');
        b.disabled = true; b.textContent = 'Kaydediliyor…';
        api('guncelle', { no: no2, kayit: {
          baslik: f.querySelector('.dBaslik').value.trim(),
          yazar: f.querySelector('.dYazar').value.trim(),
          yil: f.querySelector('.dYil').value.trim(),
          nusha: f.querySelector('.dNusha').value.trim(),
          not: f.querySelector('.dNot').value.trim(),
          kaydeden: D.ad
        } }).then(function () {
          k2.baslik = f.querySelector('.dBaslik').value.trim();
          k2.yazar = f.querySelector('.dYazar').value.trim();
          k2.yil = f.querySelector('.dYil').value.trim();
          k2.not = f.querySelector('.dNot').value.trim();
          kart2.querySelector('.bas').textContent = k2.baslik || '(başlıksız)';
          f.remove();
          goster($('msg'), 'iyi', '#' + no2 + ' güncellendi.');
        })['catch'](function (h) {
          b.disabled = false; b.textContent = 'Kaydet';
          goster($('msg'), 'hata', agHata(h));
        });
      });
    }
  });

  $('btnDaha').addEventListener('click', function () {
    mesgul($('btnDaha'), true, 'Yükleniyor…');
    yukle(false)['catch'](function () {}).then(function () { mesgul($('btnDaha'), false); });
  });

  var zaman = null;
  $('ara').addEventListener('input', function () {
    clearTimeout(zaman);
    zaman = setTimeout(function () { yukle(true)['catch'](function () {}); }, 350);
  });
  ['kategori', 'sirala', 'kapsam', 'siraSuz', 'kutuSuz'].forEach(function (id) {
    $(id).addEventListener('change', function () {
      seritYenile();
      yukle(true)['catch'](function () {});
    });
  });

  /* ───────── kutulama ─────────
     Blok usulünde kutu numarası kayıt anında bilinmiyor: kutulama envanterden
     sonra yapılıyor. Bu adım olmadan kutulanan kitap sonradan bulunamıyor —
     özellikle DEPOYA kalkanlar. Hedefe göre iki ayrı numara serisi: Y- ve D-. */
  var kutuHedefi = 'yeni';
  Array.prototype.forEach.call($('kutuHedef').querySelectorAll('button'), function (b) {
    b.addEventListener('click', function () {
      kutuHedefi = b.dataset.hedef;
      Array.prototype.forEach.call($('kutuHedef').querySelectorAll('button'), function (x) {
        x.classList.toggle('sec', x === b);
      });
    });
  });

  $('btnKutula').addEventListener('click', function () {
    var kutuNo = $('kutuNo2').value.trim();
    if (!/^\d{1,4}$/.test(kutuNo)) {
      goster($('msg'), 'hata', 'Kutu numarasını yazın (yalnızca rakam).');
      $('kutuNo2').focus();
      return;
    }
    var sira = $('siraSuz').value;
    var karar = $('kategori').value;
    if (!karar) {
      goster($('msg'), 'hata',
        'Önce <b>Karar</b> süzgecini seçin. Kutuya yalnızca <b>raftan çıkan</b> ' +
        'kitaplar girer; yerinde kalanlar (depo) kutulanmaz — adresleri zaten yer kodu.');
      return;
    }
    if (kutuHedefi === 'yeni' && karar === 'Gitmeyecek' &&
        !window.confirm('Süzgeç "Gitmeyecek" diyor ama kutu YENİ BİNA kutusu.\n\n' +
          'Gitmeyecek kitaplar yerinde kalır, kutulanmaz. Yine de devam edilsin mi?')) return;
    var onay = kutuHedefi === 'depo' ? 'DEPO' : 'YENİ BİNA';
    if (!window.confirm('Ekrandaki süzgeçle eşleşen bütün kayıtlar\n\n' +
        (kutuHedefi === 'depo' ? 'D-' : 'Y-') + kutuNo + ' (' + onay + ')\n\n' +
        'kutusuna yazılacak. Emin misiniz?')) return;

    mesgul($('btnKutula'), true, 'Kutulanıyor…');
    var y = secenekler();
    y.yalnizOnayli = true; y.bas = 0; y.adet = 300;
    var numaralar = [];
    var devam = function () {
      return api('katalog', y).then(function (r) {
        (r.kayitlar || []).forEach(function (k) { numaralar.push(k.no); });
        if (numaralar.length < r.toplam && r.kayitlar.length) {
          y.bas = numaralar.length; return devam();
        }
      });
    };
    devam().then(function () {
      if (!numaralar.length) throw new Error('Bu süzgeçle onaylanmış kayıt yok.');
      return api('kutula', { numaralar: numaralar, kutu: kutuNo, hedef: kutuHedefi,
                             paketleyen: D.ad });
    }).then(function (r) {
      goster($('msg'), 'iyi', '<b>' + esc(r.kutu) + '</b> (' + esc(r.hedef) + ') kapatıldı — ' +
        r.yazilan + ' kayıt, ' + r.cilt + ' cilt. ' +
        (r.aralik ? 'Yer kodu aralığı: <b>' + esc(r.aralik) + '</b>. ' : '') +
        (r.atlanan ? r.atlanan + ' kayıt zaten başka kutudaydı. ' : '') +
        'Kutu etiketine bu numarayı yazın.');
      $('kutuNo2').value = '';
      return yukle(true);
    })['catch'](function (e) {
      goster($('msg'), 'hata', agHata(e));
    }).then(function () { mesgul($('btnKutula'), false); });
  });

  /* ───────── ayıklama listesi ─────────
     Karar masada verildi; kitaplar hâlâ rafta ya da kutuda. Bu liste, birinin
     eline alıp gidip fiziksel ayıklamayı yapabileceği tek kâğıt. */
  function seritYenile() {
    var sira = $('siraSuz').value, kutu = $('kutuSuz').value;
    var var_ = !!(sira || kutu);
    $('ayiklaSerit').classList.toggle('gizli', !var_);
    /* Kutulama yalnızca bir sıra süzülüyken anlamlı: kutuya giren şey bir sıranın
       belli bir kararlı grubu. Kutu süzgeciyle bakarken zaten kutulanmış. */
    $('kutulaSerit').classList.toggle('gizli', !sira);
    if (var_) {
      $('ayiklaMetin').innerHTML = sira
        ? '<b>' + esc(sira) + '</b> sırasının çekme listesi'
        : '<b>Kutu ' + esc(kutu) + '</b> içeriğinin çekme listesi';
    }
  }

  function suzgecleriDoldur() {
    return api('kutular').then(function (r) {
      $('siraSuz').innerHTML = '<option value="">hepsi</option>' +
        (r.siralar || []).map(function (x) {
          return '<option value="' + esc(x) + '">' + esc(x) + '</option>';
        }).join('');
      $('kutuSuz').innerHTML = '<option value="">hepsi</option>' +
        (r.kutular || []).map(function (x) {
          return '<option value="' + esc(x) + '">Kutu ' + esc(x) + '</option>';
        }).join('');
    })['catch'](function () { /* süzgeç kritik değil */ });
  }

  $('btnAyiklaListe').addEventListener('click', function () {
    var y = secenekler();
    y.yalnizOnayli = true; y.bas = 0; y.adet = 300; y.kategori = '';
    mesgul($('btnAyiklaListe'), true, 'Hazırlanıyor…');
    var hepsi = [];
    var devam = function () {
      return api('katalog', y).then(function (r) {
        hepsi = hepsi.concat(r.kayitlar || []);
        if (hepsi.length < r.toplam && r.kayitlar.length) { y.bas = hepsi.length; return devam(); }
      });
    };
    devam().then(function () {
      if (!hepsi.length) {
        goster($('msg'), 'bos', 'Bu seçimde onaylanmış kayıt yok — önce onay masası bitirmeli.');
        return;
      }
      ayiklamaYazdir(hepsi, $('siraSuz').value, $('kutuSuz').value);
    })['catch'](function (e) { goster($('msg'), 'hata', agHata(e)); })
      .then(function () { mesgul($('btnAyiklaListe'), false); });
  });

  function ayiklamaYazdir(kayitlar, sira, kutu) {
    var kalacak = kayitlar.filter(function (k) { return k.kategori === 'Gitmeyecek'; });
    var cikacak = kayitlar.filter(function (k) { return k.kategori !== 'Gitmeyecek'; });
    var belirsiz = kayitlar.filter(function (k) { return k.kategori === 'Belirsiz'; });

    var satir = function (k) {
      return '<tr><td class="yer">' + esc(k.yer || ('#' + k.no)) + '</td>' +
        '<td>' + esc(k.baslik || '') + (k.yazar ? '<br><i>' + esc(k.yazar) + '</i>' : '') + '</td>' +
        '<td class="kod">' + esc(k.kural || '') + '</td>' +
        '<td>' + (Number(k.nusha) > 1 ? esc(k.nusha) + ' nüsha' : '') + '</td>' +
        '<td class="kutucuk"></td></tr>';
    };
    var tablo = function (baslik, liste, renk) {
      if (!liste.length) return '';
      return '<h2 style="border-left:7px solid ' + renk + '">' + baslik +
        ' <span>' + liste.length + ' kitap</span></h2>' +
        '<table><tr><th>Yer kodu</th><th>Kitap</th><th>Kural</th><th></th>' +
        '<th style="width:34px">✓</th></tr>' + liste.map(satir).join('') + '</table>';
    };

    var yer = sira ? sira + ' sırası' : (kutu ? 'Kutu ' + kutu : 'Tüm kayıtlar');
    var w = window.open('', '_blank');
    if (!w) { goster($('msg'), 'hata', 'Tarayıcı yeni sekmeyi engelledi. İzin verip tekrar deneyin.'); return; }
    w.document.write('<!doctype html><html lang="tr"><head><meta charset="utf-8">' +
      '<title>Çekme listesi — ' + esc(yer) + '</title><style>' +
      '@page{size:A4;margin:14mm}' +
      'body{font-family:Arial,sans-serif;color:#211a1d;font-size:10pt;margin:0}' +
      'h1{font-size:16pt;color:#601040;margin:0 0 2px}' +
      '.alt{color:#74686e;font-size:9pt;margin:0 0 14px}' +
      'h2{font-size:12pt;margin:16px 0 6px;padding:4px 10px;background:#f4ece7}' +
      'h2 span{float:right;font-weight:400;font-size:10pt;color:#74686e}' +
      'table{width:100%;border-collapse:collapse;margin-bottom:8px}' +
      'td,th{border:1px solid #d8ccc4;padding:4px 7px;text-align:left;font-size:9.5pt}' +
      'th{background:#faf6f3;font-size:8.5pt}' +
      '.yer{font-family:monospace;font-weight:700;white-space:nowrap}' +
      '.kod{font-weight:700;color:#601040;text-align:center}' +
      '.kutucuk{border:1px solid #211a1d}' +
      '.uyari{background:#fffbeb;border:1px solid #fde68a;padding:8px 11px;' +
      'border-radius:6px;font-size:9.5pt;margin-bottom:12px}' +
      '</style></head><body>' +
      '<h1>Çekme listesi — ' + esc(yer) + '</h1>' +
      '<p class="alt">' + kayitlar.length + ' onaylanmış kayıt · ' +
      new Date().toLocaleDateString('tr-TR') + '</p>' +
      '<div class="uyari"><b>Yalnızca ÇIKACAK listesindekileri raftan alın.</b> ' +
      'Alt listedekilere dokunmayın — onlar yerinde kalıyor, depo zaten burası. ' +
      'Çıkardıklarınızı <b>raftaki sırayla</b> kutuya koyun ve kutu numarasını ' +
      'ekrandan işleyin; kutusuz yığının kaydı yoktur. ' +
      'Listede olmayan bir kitap bulursanız <b>raftan almayın</b> — henüz onaylanmamıştır, ' +
      'koordinatöre söyleyin.' +
      (belirsiz.length ? ' <b>' + belirsiz.length + ' kitap "belirsiz"</b> — onlara ' +
       'dokunmayın, uzman masası bakacak.' : '') + '</div>' +
      tablo('ÇIKACAK — yeni binaya, Y- kutusuna', cikacak, '#2e6440') +
      tablo('YERİNDE KALACAK — depo · dokunmayın', kalacak, '#5b3a8e') +
      '</body></html>');
    w.document.close();
    setTimeout(function () { w.print(); }, 400);
  }

  /* ───────── CSV ───────── */
  $('btnCsv').addEventListener('click', function () {
    mesgul($('btnCsv'), true, 'Hazırlanıyor…');
    var y = secenekler(); y.bas = 0; y.adet = 300;
    var hepsi = [];
    var devam = function () {
      return api('katalog', y).then(function (r) {
        hepsi = hepsi.concat(r.kayitlar);
        y.bas = hepsi.length;
        if (hepsi.length < r.toplam && r.kayitlar.length) return devam();
      });
    };
    devam().then(function () {
      var basliklar = ['Kayıt no', 'Yer kodu', 'Yazar', 'Başlık', 'Yıl', 'Nüsha', 'Kategori',
        'Kural', 'Durum', 'Not', 'Kaydeden', 'Kutu no', 'Onay', 'Kapak', 'Künye fotoğrafı'];
      var satirlar = [basliklar].concat(hepsi.map(function (k) {
        return [k.no, k.yer, k.yazar, k.baslik, k.yil, k.nusha, k.kategori, k.kural,
                k.durum, k.not, k.kaydeden, k.kutu, k.onay, k.kapak, k.foto];
      })).map(function (s) {
        return s.map(function (h) {
          return '"' + String(h == null ? '' : h).replace(/"/g, '""') + '"';
        }).join(';');
      }).join('\r\n');
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + satirlar], { type: 'text/csv;charset=utf-8' }));
      a.download = 'kitap-envanteri.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    })['catch'](function (e) { goster($('msg'), 'hata', agHata(e)); })
      .then(function () { mesgul($('btnCsv'), false); });
  });

  /* ───────── açılış ───────── */
  var ad = localStorage.getItem('tv_env_ad'), sifre = localStorage.getItem('tv_env_koord_sifre');
  if (ad) $('ad').value = ad;
  if (sifre) $('sifre').value = sifre;
  /* Koordinatör panelinin sekmesinde açıldıysak (?oto=1) girişi bekletme:
     panel şifreyi zaten doğruladı, ikinci kez sordurma. */
  if (ad && sifre && /[?&]oto=1/.test(location.search)) {
    setTimeout(function () { $('btnGiris').click(); }, 60);
  }
})();
</script>
</body>
</html>
