<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Karar · Tarih Vakfı</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
<style>
  :root{
    --bordo:#601040; --krem:#fbf7f1; --kagit:#fffdf8; --murekkep:#211a1d;
    --soluk:#74686e; --cizgi:#e8dbe2; --vurgu-bg:#fbf2f7;
    --yesil:#2e6440; --sari:#a06a12; --kirmizi:#9c2233; --mavi:#2a5b86;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--krem);color:var(--murekkep);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
  .gizli{display:none!important}

  .ust{background:var(--bordo);color:#fff;padding:11px 18px;display:flex;align-items:center;gap:16px;
    position:sticky;top:0;z-index:10}
  .ust h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
  .ust .ilerleme{margin-left:auto;font-size:13.5px;opacity:.92}
  .ust .ilerleme b{font-size:17px}
  .ust button{background:#ffffff26;border:1px solid #ffffff4d;color:#fff;border-radius:7px;
    padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}

  .sayfa{max-width:980px;margin:0 auto;padding:18px}
  .kart{background:var(--kagit);border:1px solid var(--cizgi);border-radius:12px;padding:20px}
  .giris{max-width:420px;margin:60px auto}
  h2{font-size:20px;margin:0 0 4px;color:var(--bordo)}
  .ipucu{color:var(--soluk);font-size:14px;margin:0 0 16px}
  label{display:block;font-weight:600;font-size:12.5px;margin:14px 0 5px;color:var(--soluk);
    text-transform:uppercase;letter-spacing:.05em}
  input{width:100%;padding:11px 12px;border:1.5px solid var(--cizgi);border-radius:9px;
    font:inherit;font-size:16px;background:#fff;color:var(--murekkep)}
  input:focus{outline:2px solid var(--bordo);outline-offset:1px;border-color:transparent}
  .btn{padding:13px 18px;border:none;border-radius:10px;background:var(--bordo);color:#fff;
    font:inherit;font-size:16px;font-weight:700;cursor:pointer}
  .btn.genis{width:100%;margin-top:16px}
  .btn:disabled{opacity:.5;cursor:default}

  .msg{padding:12px 14px;border-radius:9px;font-size:14.5px;margin:0 0 14px;display:none;border:1px solid}
  .msg.gor{display:block}
  .msg.iyi{background:#f1f7f2;color:#2e6440;border-color:#cfe4d5}
  .msg.hata{background:#fdf2f4;color:#8a1230;border-color:#f0cdd6}
  .msg.uyari{background:#fffbeb;color:#92400e;border-color:#fde68a}

  /* Grup kartı: aynı öneriyi taşıyan kitaplar bir arada */
  .grup{border:1.5px solid var(--cizgi);border-radius:11px;margin-bottom:14px;background:#fff;
        overflow:hidden}
  .grup.yuksek{border-left:6px solid var(--yesil)}
  .grup.orta{border-left:6px solid var(--sari)}
  .grup.dusuk{border-left:6px solid var(--kirmizi)}
  .grup.elle{border-left:6px solid #9a8b92}
  .grupBas{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap;
           border-bottom:1px solid #efe7e2;background:#fdfbf7}
  .grupBas .kod{background:var(--bordo);color:#fff;border-radius:5px;padding:2px 9px;
                font-size:13.5px;font-weight:800}
  .grupBas .ne{flex:1;min-width:200px;font-size:14.5px;line-height:1.35}
  .grupBas .ne b{display:block}
  .grupBas .ne span{color:var(--soluk);font-size:12.5px}
  .grupBas .adet{font-size:21px;font-weight:800;color:var(--bordo)}
  .grupBas .hepsi{border:0;border-radius:9px;padding:9px 14px;font:inherit;font-size:13.5px;
                  font-weight:700;cursor:pointer;background:var(--yesil);color:#fff}
  .grupBas .hepsi:disabled{opacity:.5;cursor:default}

  /* Kitap satırı */
  .uye{border-bottom:1px solid #f2ebe6;padding:8px 14px}
  .uye:last-child{border-bottom:none}
  .uye.bitti .satir{opacity:.4}
  .satir{display:flex;align-items:center;gap:11px}
  .kapakMini{flex:0 0 38px;width:38px;height:52px;border-radius:4px;
      background:#efe7e0 center/cover no-repeat;border:1px solid #d8ccc4;
      cursor:zoom-in;display:flex;align-items:center;justify-content:center;
      font-size:15px;color:#b9a9b1}
  .kunye{flex:1;min-width:0;font-size:13.5px;line-height:1.35}
  .kunye .yk{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;
      color:var(--bordo);font-size:12px;cursor:help;border-bottom:1px dotted #c9a7b8}
  .kunye .ad{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kunye .alt{color:var(--soluk);font-size:12px;display:block;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
  .kunye .dikkat{color:#8a5a1c;font-weight:700}
  .tikler{flex:0 0 auto;display:flex;gap:6px}
  .tikler button{height:38px;border-radius:9px;border:1.5px solid;background:#fff;
      font-weight:800;font-size:13.5px;cursor:pointer;padding:0 11px;font-family:inherit}
  .tikler .tOner{border-color:var(--bordo);color:var(--bordo)}
  .tikler .tG{border-color:var(--yesil);color:var(--yesil)}
  .tikler .tK{border-color:var(--kirmizi);color:var(--kirmizi)}
  .tikler .tAc{border-color:#c9bcc3;color:var(--soluk);font-weight:600}
  .tikler button:disabled{opacity:.35;cursor:default}
  .sonuc{flex:0 0 auto;font-size:12.5px;font-weight:700;max-width:130px;text-align:right}

  /* Satır altı: tüm kararlar açık hâlde */
  .secim{margin:10px 0 4px 49px;border:1.5px solid var(--cizgi);border-radius:10px;
         padding:11px 13px;background:#fdfbf7}
  .secim .katlar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
  .secim .kat{border:0;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;
      font-weight:700;color:#fff;cursor:pointer}
  .kat.g{background:var(--yesil)} .kat.s{background:var(--sari)}
  .kat.k{background:var(--kirmizi)} .kat.m{background:var(--mavi)}
  .kat.pasif{opacity:.38}
  .secim .cip{display:block;width:100%;text-align:left;border:1.5px solid var(--cizgi);
      background:#fff;border-radius:8px;padding:9px 11px;margin-bottom:6px;
      font:inherit;font-size:13.5px;cursor:pointer;line-height:1.3}
  .secim .cip b{display:inline-block;min-width:32px;color:var(--bordo)}
  .secim .cip:hover{border-color:var(--bordo)}
  .secim .diger{display:flex;gap:8px;margin-top:2px}
  .secim .diger input{font-size:14px;padding:9px 11px}
  .secim .diger button{border:0;border-radius:8px;background:var(--bordo);color:#fff;
      font:inherit;font-size:13.5px;font-weight:700;padding:0 14px;cursor:pointer;white-space:nowrap}
  .secim .kapat{background:none;border:none;color:var(--soluk);font:inherit;font-size:12.5px;
      cursor:pointer;text-decoration:underline;padding:4px 0 0}

  /* Kapak büyütme */
  #buyukKapak{position:fixed;inset:0;background:rgba(20,10,16,.85);z-index:60;
      display:flex;align-items:center;justify-content:center;cursor:zoom-out}
  #buyukKapak img{max-width:92vw;max-height:92vh;border-radius:8px;
      box-shadow:0 10px 50px rgba(0,0,0,.5)}
  #buyukKapak.gizli{display:none}

  .bitti{text-align:center;padding:50px 20px}
  .bitti p{color:var(--soluk)}
  .donen{display:inline-block;width:14px;height:14px;border:2px solid #ffffff59;border-top-color:#fff;
    border-radius:50%;animation:don .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes don{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="ust gizli" id="ust">
  <h1>Karar</h1>
  <button id="btnYenile">Listeyi yenile</button>
  <div class="ilerleme"><b id="ilerlemeSayi">0</b> kitap karar bekliyor</div>
</div>

<div class="sayfa">

  <!-- giriş -->
  <section id="adim-giris" class="kart giris">
    <h2>Karar</h2>
    <p class="ipucu">Künyesi onaylanmış kitaplar burada: gidecek mi, kalacak mı?
      Öneriler hazır gelir — çoğu kitap tek dokunuşla kapanır.</p>
    <div class="msg" id="msgGiris"></div>
    <label for="ad">Adınız</label>
    <input type="text" id="ad" placeholder="Ad Soyad" autocomplete="name">
    <label for="sifre">Koordinatör şifresi</label>
    <input type="text" id="sifre" autocapitalize="none" autocorrect="off">
    <button class="btn genis" id="btnGiris">Başla</button>
  </section>

  <!-- karar ekranı -->
  <section id="adim-karar" class="gizli">
    <div class="msg" id="msg"></div>
    <div id="liste"></div>
    <div class="kart bitti gizli" id="bos">
      <h2>Karar bekleyen kitap yok</h2>
      <p>Künye Onayı sekmesinde künyesi onaylanan her kitap buraya düşer.</p>
      <button class="btn" id="btnTekrar">Yeniden bak</button>
    </div>
  </section>

  <div id="buyukKapak" class="gizli"><img alt="Kapak büyük görünüm"></div>
</div>

<script src="./js/gonullu-config.js?v=20260823"></script>
<script>
var ENVANTER_URL = window.TV_ENVANTER_URL || 'BURAYA_APPS_SCRIPT_ADRESINI_YAPISTIRIN';

(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var D = { ad: '', sifre: '', kayitlar: [], kalan: 0, cfg: null };

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  function goster(el, sinif, metin) { el.className = 'msg ' + sinif + ' gor'; el.innerHTML = metin; }
  function gizle(el) { el.className = 'msg'; }
  function mesgul(b, acik, metin) {
    if (acik) { b.dataset.eski = b.innerHTML; b.innerHTML = '<span class="donen"></span>' + (metin || '…'); b.disabled = true; }
    else { b.innerHTML = b.dataset.eski || b.innerHTML; b.disabled = false; }
  }

  var TEKRARLANABILIR = ['config', 'kararBekleyen'];
  function tekIstek(action, yuk, sure) {
    var govde = { action: action, sifre: D.sifre };
    for (var k in (yuk || {})) govde[k] = yuk[k];
    var kes = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var saat = setTimeout(function () { if (kes) kes.abort(); }, sure);
    var bitir = function () { clearTimeout(saat); };
    return fetch(ENVANTER_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(govde), redirect: 'follow', signal: kes ? kes.signal : undefined
    }).catch(function () { bitir(); throw new Error('AĞ'); })
      .then(function (r) { bitir(); return r.text(); })
      .then(function (m) {
        var d;
        try { d = JSON.parse(m); } catch (h) { throw new Error('Sunucudan beklenmeyen yanıt.'); }
        if (!d.ok) throw new Error(d.error || 'Hata');
        return d;
      });
  }
  function api(action, yuk) {
    if (/BURAYA_APPS_SCRIPT/.test(ENVANTER_URL)) {
      return Promise.reject(new Error('Sistem adresi tanımlanmamış (TV_ENVANTER_URL).'));
    }
    var kalan = TEKRARLANABILIR.indexOf(action) >= 0 ? 2 : 0;
    function dene(kalanDeneme, bekle) {
      return tekIstek(action, yuk, 30000)['catch'](function (e) {
        if (e.message !== 'AĞ' || kalanDeneme <= 0) throw e;
        return new Promise(function (t) { setTimeout(t, bekle); })
          .then(function () { return dene(kalanDeneme - 1, bekle * 2); });
      });
    }
    return dene(kalan, 1200);
  }
  function ağHata(e) { return e.message === 'AĞ' ? 'Sunucuya ulaşılamadı.' : e.message; }

  function yerAciklama(kod) {
    var e = /^([^-]+)-([A-ZÇĞİÖŞÜ]+)(\d+)-(\d+)$/.exec(String(kod || '').trim());
    if (!e) return kod || '';
    var mekanAd = e[1];
    ((D.cfg && D.cfg.mekanlar) || []).forEach(function (m) {
      if (String(m.kod).toUpperCase() === e[1].toUpperCase()) mekanAd = m.ad;
    });
    return kod + ' = ' + mekanAd + ' · ' + e[2] + ' rafı · ' +
           Number(e[3]) + '. sıra · ' + Number(e[4]) + '. kitap';
  }
  function kucukKapak(id) { return id ? 'https://drive.google.com/thumbnail?id=' + id + '&sz=w200' : ''; }
  function buyukKapak(id) { return id ? 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1200' : ''; }

  /* ───────── giriş ───────── */
  $('btnGiris').addEventListener('click', function () {
    var ad = $('ad').value.trim(), sifre = $('sifre').value.trim();
    if (ad.length < 2) return goster($('msgGiris'), 'hata', 'Adınızı yazın.');
    if (!sifre) return goster($('msgGiris'), 'hata', 'Koordinatör şifresini yazın.');
    D.ad = ad; D.sifre = sifre;
    mesgul($('btnGiris'), true, 'Kontrol ediliyor…');
    api('config').then(function (cfg) {
      if (!cfg || !cfg.kurallar || !cfg.kategoriler) {
        throw new Error('Sunucudan gelen ayarlar eksik. Koordinatöre bildirin.');
      }
      D.cfg = cfg;
      return listeGetir();
    }).then(function () {
      localStorage.setItem('tv_env_ad', ad);
      localStorage.setItem('tv_env_koord_sifre', sifre);
      gizle($('msgGiris'));
      $('adim-giris').classList.add('gizli');
      $('adim-karar').classList.remove('gizli');
      $('ust').classList.remove('gizli');
      ciz();
    })['catch'](function (e) {
      goster($('msgGiris'), 'hata', ağHata(e));
    }).then(function () { mesgul($('btnGiris'), false); });
  });
  $('sifre').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnGiris').click(); });

  /* ───────── liste ───────── */
  function listeGetir() {
    return api('kararBekleyen', { adet: 100 }).then(function (r) {
      D.kayitlar = r.kayitlar || [];
      D.kalan = r.kalan || 0;
      $('ilerlemeSayi').textContent = D.kalan;
      return r;
    });
  }
  $('btnYenile').addEventListener('click', function () {
    mesgul($('btnYenile'), true, 'Yenileniyor…');
    listeGetir().then(ciz)['catch'](function (e) { goster($('msg'), 'hata', ağHata(e)); })
      .then(function () { mesgul($('btnYenile'), false); });
  });
  $('btnTekrar').addEventListener('click', function () { $('btnYenile').click(); });

  /* ───────── çizim: öneriye göre gruplanmış liste ─────────
     Aynı öneriyi taşıyan kitaplar bir kartta toplanır; koordinatör isterse
     kartın hepsini tek tıkla kapatır, isterse satır satır karar verir. */
  function ciz() {
    var gruplar = {}, sirali = [];
    D.kayitlar.forEach(function (k) {
      var a = k.oneriKural || '__yok';
      if (!gruplar[a]) {
        gruplar[a] = { kural: k.oneriKural || '', kategori: k.oneriKategori || '',
                       guven: k.oneriGuven || '', sebep: k.oneriSebep || '', uyeler: [] };
        sirali.push(gruplar[a]);
      }
      gruplar[a].uyeler.push(k);
    });
    // Kalabalık ve güvenli gruplar üste; önerisizler en sona.
    sirali.sort(function (a, b) {
      if (!a.kural !== !b.kural) return a.kural ? -1 : 1;
      var za = a.guven === 'dusuk' ? 1 : 0, zb = b.guven === 'dusuk' ? 1 : 0;
      return za !== zb ? za - zb : b.uyeler.length - a.uyeler.length;
    });

    D.gruplar = sirali;                 // uyeSatiri çizim sırasında buna bakar
    $('bos').classList.toggle('gizli', !!D.kayitlar.length);
    $('liste').innerHTML = sirali.map(function (g, gi) {
      var katAd = g.kategori && D.cfg.kategoriler[g.kategori]
        ? D.cfg.kategoriler[g.kategori].ad : '';
      var aciklama = '';
      (D.cfg.kurallar || []).forEach(function (x) { if (x.kod === g.kural) aciklama = x.aciklama; });

      var bas = g.kural
        ? '<div class="grupBas">' +
            '<span class="kod">' + esc(g.kural) + '</span>' +
            '<div class="ne"><b>' + esc(katAd) + ' — ' + esc(aciklama) + '</b>' +
              '<span>' + esc(g.sebep) + (g.guven === 'dusuk' ? ' · zayıf öneri — satır satır bakın' : '') +
            '</span></div>' +
            '<span class="adet" data-adet="' + gi + '">' + g.uyeler.length + '</span>' +
            (g.uyeler.length > 1 && g.guven !== 'dusuk'
              ? '<button class="hepsi" data-hepsi="' + gi + '">Hepsine uygula</button>' : '') +
          '</div>'
        : '<div class="grupBas">' +
            '<div class="ne"><b>Öneri yok — kararı siz vereceksiniz</b>' +
              '<span>Satırdaki düğmelerle: Gitsin, Kalsın ya da ⋯ ile ayrıntılı seçim.</span></div>' +
            '<span class="adet" data-adet="' + gi + '">' + g.uyeler.length + '</span>' +
          '</div>';

      return '<div class="grup ' + (g.kural ? esc(g.guven || 'orta') : 'elle') +
        '" data-grup="' + gi + '">' + bas +
        g.uyeler.map(function (k) { return uyeSatiri(k, gi); }).join('') +
        '</div>';
    }).join('');
  }

  function uyeSatiri(k, gi) {
    var kapak = k.kapakId || k.fotoId || '';
    var altlar = [k.yazar, k.yil, (Number(k.nusha) > 1 ? k.nusha + ' nüsha' : '')]
      .filter(Boolean).join(' · ');
    var dikkat = [];
    if (k.durum && k.durum !== 'Sağlam') dikkat.push(k.durum);
    if (k.not) dikkat.push('Not: ' + k.not);
    return '<div class="uye" data-no="' + k.no + '">' +
      '<div class="satir">' +
        '<div class="kapakMini"' + (kapak ? ' data-kapak="' + esc(kapak) +
          '" style="background-image:url(' + kucukKapak(kapak) + ')"' : '') + '>' +
          (kapak ? '' : '—') + '</div>' +
        '<div class="kunye">' +
          '<span class="yk" title="' + esc(yerAciklama(k.yer)) + '">' + esc(k.yer || ('#' + k.no)) + '</span>' +
          '<span class="ad">' + esc(k.baslik || '(başlık yok)') + '</span>' +
          '<span class="alt">' + esc(altlar || '—') +
            (dikkat.length ? ' · <span class="dikkat">' + esc(dikkat.join(' · ')) + '</span>' : '') +
          '</span></div>' +
        '<div class="tikler">' +
          (D.gruplarOneri(gi) ? '<button class="tOner" data-k="oner" data-g="' + gi + '" data-no="' + k.no +
            '" title="Öneriyle kapat">✓ Öneri</button>' : '') +
          '<button class="tG" data-k="gidecek" data-no="' + k.no + '" title="Yeni binaya gitsin">G</button>' +
          '<button class="tK" data-k="gitmeyecek" data-no="' + k.no + '" title="Yerinde kalsın">K</button>' +
          '<button class="tAc" data-ac="' + k.no + '" title="Bütün seçenekler">⋯</button>' +
        '</div><span class="sonuc"></span>' +
      '</div>' +
      '<div class="secim gizli" data-secim="' + k.no + '"></div>' +
    '</div>';
  }
  D.gruplarOneri = function (gi) {
    return D.gruplar && D.gruplar[gi] && D.gruplar[gi].kural;
  };

  /* ───────── kararlar ───────── */
  function kayitBul(no) {
    for (var i = 0; i < D.kayitlar.length; i++) if (D.kayitlar[i].no === no) return D.kayitlar[i];
    return null;
  }

  function satirKapat(uye, yazi, renk) {
    uye.classList.add('bitti');
    uye.querySelector('.sonuc').innerHTML = '<span style="color:' + renk + '">' + yazi + ' ✓</span>';
    Array.prototype.forEach.call(uye.querySelectorAll('button'), function (b) { b.disabled = true; });
    var s = uye.querySelector('.secim'); if (s) s.classList.add('gizli');
    D.kalan = Math.max(0, D.kalan - 1);
    $('ilerlemeSayi').textContent = D.kalan;
  }

  function kararGonder(numaralar, kategori, kural, tamam, hata) {
    api('kararVer', { numaralar: numaralar, kategori: kategori, kural: kural, veren: D.ad })
      .then(tamam)['catch'](hata);
  }

  $('liste').addEventListener('click', function (e) {
    var mini = e.target.closest('.kapakMini');
    if (mini && mini.dataset.kapak) {
      $('buyukKapak').querySelector('img').src = buyukKapak(mini.dataset.kapak);
      $('buyukKapak').classList.remove('gizli');
      return;
    }

    var hepsi = e.target.closest('[data-hepsi]');
    if (hepsi) { grubaUygula(Number(hepsi.dataset.hepsi), hepsi); return; }

    var ac = e.target.closest('[data-ac]');
    if (ac) { secimAc(Number(ac.dataset.ac)); return; }

    var d = e.target.closest('[data-k]');
    if (d && !d.disabled) {
      var no = Number(d.dataset.no);
      var uye = d.closest('.uye');
      var kategori, kural, yazi, renk;
      if (d.dataset.k === 'oner') {
        var g = D.gruplar[Number(d.dataset.g)];
        kategori = g.kategori; kural = g.kural;
        yazi = esc(g.kural); renk = 'var(--yesil)';
      } else if (d.dataset.k === 'gidecek') {
        kategori = 'gidecek'; kural = 'Y0'; yazi = 'gitsin'; renk = 'var(--yesil)';
      } else {
        kategori = 'gitmeyecek'; kural = 'K0'; yazi = 'kalsın'; renk = 'var(--kirmizi)';
      }
      Array.prototype.forEach.call(uye.querySelectorAll('button'), function (b) { b.disabled = true; });
      kararGonder([no], kategori, kural, function (r) {
        if (r.yazilan && r.yazilan.length) { satirKapat(uye, yazi, renk); grupSayaci(uye); }
        else atlandiGoster(uye, r);
      }, function (h) {
        uye.querySelector('.sonuc').innerHTML = '<span style="color:#8a1c2c">' + esc(ağHata(h)) + '</span>';
        Array.prototype.forEach.call(uye.querySelectorAll('button'), function (b) { b.disabled = false; });
      });
    }
  });

  function atlandiGoster(uye, r) {
    var neden = (r.atlanan && r.atlanan[0] && r.atlanan[0].neden) || 'işlenemedi';
    uye.querySelector('.sonuc').innerHTML = '<span style="color:#8a5a1c">' + esc(neden) + '</span>';
    Array.prototype.forEach.call(uye.querySelectorAll('button'), function (b) { b.disabled = false; });
  }

  function grupSayaci(uye) {
    var kart = uye.closest('.grup');
    var acik = kart.querySelectorAll('.uye:not(.bitti)').length;
    var adet = kart.querySelector('.adet');
    if (adet) adet.textContent = acik;
    var hepsi = kart.querySelector('.hepsi');
    if (hepsi && acik < 2) hepsi.style.display = 'none';
  }

  function grubaUygula(gi, dugme) {
    var g = D.gruplar[gi];
    if (!g) return;
    var kart = $('liste').querySelector('[data-grup="' + gi + '"]');
    var acikUyeler = Array.prototype.filter.call(kart.querySelectorAll('.uye'),
      function (u) { return !u.classList.contains('bitti'); });
    var numaralar = acikUyeler.map(function (u) { return Number(u.dataset.no); });
    if (!numaralar.length) return;
    if (!window.confirm(numaralar.length + ' kitabın hepsi "' + g.kural +
        '" kuralıyla kapanacak.\n\nEmin misiniz?')) return;
    mesgul(dugme, true, 'Uygulanıyor…');
    kararGonder(numaralar, g.kategori, g.kural, function (r) {
      acikUyeler.forEach(function (u) {
        if ((r.yazilan || []).indexOf(Number(u.dataset.no)) >= 0) {
          satirKapat(u, esc(g.kural), 'var(--yesil)');
        }
      });
      grupSayaci(acikUyeler[0] || kart.querySelector('.uye'));
      mesgul(dugme, false);
      if (r.atlanan && r.atlanan.length) {
        goster($('msg'), 'uyari', r.atlanan.length + ' kayıt atlandı (başkası karar vermiş olabilir) — liste yenileyin.');
      } else {
        goster($('msg'), 'iyi', '<b>' + (r.yazilan || []).length + ' kitap</b> ' +
          esc(g.kural) + ' ile kapandı.');
      }
    }, function (h) {
      mesgul(dugme, false);
      goster($('msg'), 'hata', ağHata(h));
    });
  }

  /* ⋯ paneli: dört karar + kural listesi + Diğer. Kural çipine dokunmak kararı
     hemen uygular — ikinci bir "kaydet" düğmesi yok. */
  function secimAc(no) {
    var uye = $('liste').querySelector('.uye[data-no="' + no + '"]');
    var panel = uye.querySelector('.secim');
    if (!panel.classList.contains('gizli')) { panel.classList.add('gizli'); return; }
    panel.classList.remove('gizli');
    panelCiz(panel, no, '');
  }

  function panelCiz(panel, no, kat) {
    var sinif = { gidecek: 'g', belki: 's', gitmeyecek: 'k', belirsiz: 'm' };
    var katlar = Object.keys(D.cfg.kategoriler).filter(function (a) {
      return !D.cfg.kategoriler[a].serbest;
    }).map(function (a) {
      return '<button type="button" class="kat ' + sinif[a] + (kat && kat !== a ? ' pasif' : '') +
        '" data-pk="' + a + '">' + esc(D.cfg.kategoriler[a].ad) + '</button>';
    }).join('');

    var govde = '';
    if (kat) {
      var liste = (D.cfg.kurallar || []).filter(function (x) {
        return x.kategori === kat && !/0$/.test(x.kod);
      });
      govde = liste.map(function (x) {
        return '<button type="button" class="cip" data-pkural="' + esc(x.kod) +
          '" data-pkat="' + esc(kat) + '"><b>' + esc(x.kod) + '</b>' + esc(x.aciklama) + '</button>';
      }).join('') +
        '<div class="diger">' +
          '<input type="text" maxlength="110" placeholder="Diğer — kısa açıklama (örn: harita, plak)" data-pdiger>' +
          '<button type="button" data-pdigerok data-pkat="' + esc(kat) + '">Uygula</button>' +
        '</div>';
    }
    panel.innerHTML = '<div class="katlar">' + katlar + '</div>' + govde +
      '<button type="button" class="kapat" data-pkapat>vazgeç</button>';

    panel.onclick = function (e) {
      var pk = e.target.closest('[data-pk]');
      if (pk) { panelCiz(panel, no, pk.dataset.pk); return; }
      if (e.target.closest('[data-pkapat]')) { panel.classList.add('gizli'); return; }
      var cip = e.target.closest('[data-pkural]');
      var digerOk = e.target.closest('[data-pdigerok]');
      if (!cip && !digerOk) return;

      var kategori = (cip || digerOk).dataset.pkat;
      var kural;
      if (cip) kural = cip.dataset.pkural;
      else {
        var metin = panel.querySelector('[data-pdiger]').value.trim();
        if (!metin) { panel.querySelector('[data-pdiger]').focus(); return; }
        kural = 'Diğer: ' + metin;
      }
      var uye = panel.closest('.uye');
      Array.prototype.forEach.call(uye.querySelectorAll('button'), function (b) { b.disabled = true; });
      kararGonder([no], kategori, kural, function (r) {
        if (r.yazilan && r.yazilan.length) {
          satirKapat(uye, esc(kural.length > 14 ? kural.slice(0, 14) + '…' : kural),
            kategori === 'gitmeyecek' ? 'var(--kirmizi)' : 'var(--yesil)');
          grupSayaci(uye);
        } else atlandiGoster(uye, r);
      }, function (h) {
        uye.querySelector('.sonuc').innerHTML = '<span style="color:#8a1c2c">' + esc(ağHata(h)) + '</span>';
        Array.prototype.forEach.call(uye.querySelectorAll('button'), function (b) { b.disabled = false; });
      });
    };
  }

  $('buyukKapak').addEventListener('click', function () {
    $('buyukKapak').classList.add('gizli');
    $('buyukKapak').querySelector('img').removeAttribute('src');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('buyukKapak').classList.contains('gizli')) {
      $('buyukKapak').classList.add('gizli');
      $('buyukKapak').querySelector('img').removeAttribute('src');
    }
  });

  /* Koordinatör panelinde sekmeye her dönüşte liste kendiliğinden tazelenir;
     ayrıca sayfa yeniden görünür olduğunda da (başka pencereden dönüş). */
  function kendiliğindenYenile() {
    if ($('adim-karar').classList.contains('gizli')) return;   // henüz giriş yok
    if ($('btnYenile').disabled) return;                       // zaten yenileniyor
    $('btnYenile').click();
  }
  window.addEventListener('message', function (e) {
    if (e.data && e.data.tv === 'sekme') kendiliğindenYenile();
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) kendiliğindenYenile();
  });

  /* ───────── açılış ───────── */
  var ad = localStorage.getItem('tv_env_ad'), sifre = localStorage.getItem('tv_env_koord_sifre');
  if (ad) $('ad').value = ad;
  if (sifre) $('sifre').value = sifre;
  if (ad && sifre && /[?&]oto=1/.test(location.search)) {
    setTimeout(function () { $('btnGiris').click(); }, 60);
  }
})();
</script>
</body>
</html>
