<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Envanter Durumu · DENEME</title>
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
<style>
  :root{
    --bordo:#601040; --krem:#fbf7f1; --kagit:#fffdf8; --murekkep:#211a1d;
    --soluk:#74686e; --cizgi:#e8dbe2; --vurgu-bg:#fbf2f7;

    /* Grafik renkleri — CVD ve kontrast denetiminden geçirilmiş tonlar.
       Arayüzdeki düğme renklerinden biraz farklı: orada beyaz yazı okunaklı olsun
       diye koyu tonlar var, burada zemine karşı ayırt edilebilirlik aranıyor. */
    --gidecek:#0d6b3e; --belki:#c08400; --gitmeyecek:#b81d33; --belirsiz:#1a6fbd;
    --iyi:#0d6b3e; --uyari:#c08400; --ciddi:#b81d33;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--krem);color:var(--murekkep);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
  .gizli{display:none!important}

  .ust{background:var(--bordo);color:#fff;padding:11px 18px;display:flex;align-items:center;
    gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  .ust h1{font-size:17px;margin:0;font-weight:700}
  .ust .sag{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12.5px;opacity:.92}
  .ust button{background:#ffffff26;border:1px solid #ffffff4d;color:#fff;border-radius:7px;
    padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}

  .sayfa{max-width:1080px;margin:0 auto;padding:18px}
  .kart{background:var(--kagit);border:1px solid var(--cizgi);border-radius:12px;padding:20px;
    margin-bottom:16px}
  .giris{max-width:420px;margin:60px auto}
  h2{font-size:20px;margin:0 0 4px;color:var(--bordo)}
  h3{font-size:14px;margin:0 0 3px;color:var(--murekkep);font-weight:700}
  .altbaslik{color:var(--soluk);font-size:13px;margin:0 0 16px}
  label{display:block;font-weight:600;font-size:12.5px;margin:14px 0 5px;color:var(--soluk);
    text-transform:uppercase;letter-spacing:.05em}
  input{width:100%;padding:11px 12px;border:1.5px solid var(--cizgi);border-radius:9px;
    font:inherit;font-size:16px;background:#fff}
  input:focus{outline:2px solid var(--bordo);outline-offset:1px;border-color:transparent}
  .btn{padding:12px 18px;border:none;border-radius:10px;background:var(--bordo);color:#fff;
    font:inherit;font-size:16px;font-weight:700;cursor:pointer}
  .btn.genis{width:100%;margin-top:16px}

  /* kahraman sayı + künye kutuları */
  .kunye-satir{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .kutu{background:var(--kagit);border:1px solid var(--cizgi);border-radius:12px;padding:15px 17px}
  .kutu .etiket{font-size:12px;color:var(--soluk);text-transform:uppercase;letter-spacing:.06em}
  .kutu .sayi{font-size:30px;font-weight:700;line-height:1.15;margin-top:4px;
    font-variant-numeric:tabular-nums}
  .kutu .alt{font-size:12.5px;color:var(--soluk);margin-top:2px}
  .kahraman{grid-column:span 2}
  .kahraman .sayi{font-size:48px}
  @media (max-width:560px){ .kahraman{grid-column:span 1} }

  /* yığılmış çubuk */
  .yigin{display:flex;height:34px;border-radius:6px;overflow:hidden;background:var(--kagit);
    margin:6px 0 10px}
  .yigin span{position:relative;transition:filter .15s}
  .yigin span + span{margin-left:2px}          /* zemin boşluğu: bitişik parçaları ayırır */
  .yigin span:hover{filter:brightness(1.08)}
  .aciklama{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px;color:var(--soluk)}
  .aciklama i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;
    vertical-align:-1px}
  .aciklama b{color:var(--murekkep);font-variant-numeric:tabular-nums}

  /* sütun grafiği */
  .sutunlar{display:flex;align-items:flex-end;gap:4px;height:130px;margin:10px 0 4px}
  .sutunlar .gun{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;
    position:relative}
  .sutunlar .cubuk{background:var(--bordo);border-radius:4px 4px 0 0;transition:filter .15s}
  .sutunlar .gun:hover .cubuk{filter:brightness(1.25)}
  .sutunlar .deger{font-size:11px;color:var(--soluk);text-align:center;margin-bottom:3px;
    font-variant-numeric:tabular-nums}
  .eksen{display:flex;gap:4px;font-size:10.5px;color:var(--soluk)}
  .eksen div{flex:1;text-align:center}

  /* ölçek çubuğu */
  .olcek{height:26px;border-radius:6px;background:var(--cizgi);overflow:hidden;margin:8px 0 6px;
    display:flex}
  .olcek span{display:block}

  /* tablolar */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11.5px;color:var(--soluk);text-transform:uppercase;
    letter-spacing:.05em;font-weight:600;padding:0 10px 7px 0;border-bottom:1px solid var(--cizgi)}
  td{padding:7px 10px 7px 0;border-bottom:1px solid var(--cizgi);font-variant-numeric:tabular-nums}
  td.ad{font-family:ui-monospace,Menlo,monospace;font-size:13px}
  td:last-child,th:last-child{text-align:right;padding-right:0}
  .kaydir{max-height:280px;overflow:auto}

  .durum-satir{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--cizgi);
    font-size:14px}
  .durum-satir:last-child{border-bottom:none}
  .durum-satir .im{width:20px;text-align:center;font-weight:700}
  .durum-satir .sayi{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
  .iyi-r{color:var(--iyi)} .uyari-r{color:var(--uyari)} .ciddi-r{color:var(--ciddi)}

  .not{font-size:12.5px;color:var(--soluk);margin:10px 0 0;line-height:1.4}
  .msg{padding:12px 14px;border-radius:9px;font-size:14.5px;margin:0 0 14px;display:none;border:1px solid}
  .msg.gor{display:block}
  .msg.hata{background:#fdf2f4;color:#8a1230;border-color:#f0cdd6}
  .donen{display:inline-block;width:14px;height:14px;border:2px solid #ffffff59;border-top-color:#fff;
    border-radius:50%;animation:don .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes don{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="ust gizli" id="ust">
  <h1>Envanter Durumu</h1>
  <div class="sag">
    <span id="ustZaman"></span>
    <button id="btnYenile">Yenile</button>
  </div>
</div>

<div class="sayfa">
  <section id="adim-giris" class="kart giris">
    <h2>Envanter Durumu</h2>
    <p class="altbaslik">Çalışmanın nerede olduğunu tek ekranda gösterir.</p>
    <div class="msg" id="msgGiris"></div>
    <label for="ad">Adınız</label>
    <input type="text" id="ad" placeholder="Ad Soyad" autocomplete="name">
    <label for="sifre">Koordinatör şifresi</label>
    <input type="text" id="sifre" placeholder="Gönüllülerinkinden farklı" autocapitalize="none" autocorrect="off">
    <button class="btn genis" id="btnGiris">Aç</button>
  </section>

  <section id="adim-pano" class="gizli">
    <div class="msg" id="msg"></div>

    <div class="kunye-satir" id="kunyeler"></div>

    <div class="kart" style="margin-top:16px">
      <h3>Karar dağılımı</h3>
      <p class="altbaslik" id="kararAlt"></p>
      <div class="yigin" id="kararYigin"></div>
      <div class="aciklama" id="kararAciklama"></div>
      <table id="kararTablo" style="margin-top:14px"></table>
    </div>

    <div class="kart">
      <h3>Günlük ilerleme</h3>
      <p class="altbaslik">Son 14 günde kaydedilen kitap</p>
      <div class="sutunlar" id="gunlukSutun"></div>
      <div class="eksen" id="gunlukEksen"></div>
      <p class="not" id="gunlukNot"></p>
    </div>

    <div class="kart" id="hedefKart">
      <h3>Yeni binaya sığacak mı?</h3>
      <p class="altbaslik" id="hedefAlt"></p>
      <div class="olcek" id="hedefOlcek"></div>
      <div class="aciklama" id="hedefAciklama"></div>
    </div>

    <div class="kart">
      <h3>İşleyiş</h3>
      <p class="altbaslik">Fotoğraf, okuma ve fiziksel durum</p>
      <div id="isleyis"></div>
    </div>

    <div class="kart">
      <h3>Sıralar</h3>
      <p class="altbaslik">Hangi sırada kaç kitap kaydedildi</p>
      <div class="kaydir"><table id="siraTablo"></table></div>
    </div>

    <div class="kart">
      <h3>Kaydedenler</h3>
      <p class="altbaslik">Bugün ve toplam</p>
      <table id="kisiTablo"></table>
    </div>
  </section>
</div>

<script src="./js/gonullu-config.js?v=20260818"></script>

<script>
/* ══════════════ DENEME ARKA UCU ══════════════
   Bu sayfa Google'a hiç bağlanmaz. İstekler burada karşılanır, kayıtlar
   yalnızca bu telefonun hafızasında durur. Gerçek sayfa: kitap-envanteri.html */
(function () {
  'use strict';
  window.TV_ENVANTER_URL = 'https://deneme.yerel/exec';
  var DEPO = 'tv_demo_veri';
  var SIFRE = 'deneme';
  var KOORD_SIFRE = 'koordinator';
  var KOORDINATOR_EYLEMLERI = ['onayBekleyen', 'onayla', 'katalog', 'durum'];
  var agKapali = false;

  var KATEGORILER = {
    gidecek:   { ad: 'Gidecek' },      belki:     { ad: 'Gitse de olur' },
    gitmeyecek:{ ad: 'Gitmeyecek' },   belirsiz:  { ad: 'Belirsiz' }
  };
  var DURUMLAR = ['Sağlam', 'Yıpranmış', 'Küflü/böcekli'];
  var KURALLAR = [
    ['Y1','gidecek','Tarih Vakfı yayınları ve vakıf tarihine ait her şey'],
    ['Y2','gidecek','Türkiye ekonomik/toplumsal tarihi, kent tarihi, sözlü tarih'],
    ['Y3','gidecek','İmzalı, ithaflı veya ex-libris’li nüsha'],
    ['Y4','gidecek','1950 öncesi baskı; Osmanlıca / eski harfli eser'],
    ['Y5','gidecek','Rapor, tez, bülten, katalog, broşür'],
    ['Y6','gidecek','Süreli yayının tam serisi'],
    ['Y7','gidecek','Şartlı bağış koleksiyonunun parçası'],
    ['S1','belki','İkinci veya üçüncü kopya'],
    ['S2','belki','Genel başvuru kaynağı'],
    ['S3','belki','Dolaylı ilgili, yabancı dilde'],
    ['S4','belki','Güncelliğini kısmen yitirmiş'],
    ['S5','belki','Sağlam ama önceliği düşük'],
    ['K1','gitmeyecek','Alan dışı: ders/sınav kitabı, popüler kurgu'],
    ['K2','gitmeyecek','Güncelliğini yitirmiş mevzuat, yıllık/katalog fazlası'],
    ['K3','gitmeyecek','Üçten fazla mükerrer nüshanın fazlası'],
    ['K4','gitmeyecek','Ağır hasarlı ve kolay bulunabilir'],
    ['K5','gitmeyecek','Süreli yayının dağınık tek sayısı'],
    ['K6','gitmeyecek','Tanıtım/promosyon malzemesi'],
    ['M1','belirsiz','On saniyede karar veremedim'],
    ['M2','belirsiz','Değerli olabilir şüphesi'],
    ['M3','belirsiz','Yabancı dilde, içeriği anlamadım'],
    ['M4','belirsiz','Kurallar çelişiyor']
  ];
  var MEKANLAR = [{ kod:'G', ad:'Giriş Kat' }, { kod:'U', ad:'Üst Kat' }, { kod:'D', ad:'Depo' }];
  var RAF_HARFLERI = 'ABCDEFGH'.split('');
  var SIRA_SAYISI = 8;

  function oku() {
    try { return JSON.parse(localStorage.getItem(DEPO) || '{}'); } catch (h) { return {}; }
  }
  function yaz(v) { try { localStorage.setItem(DEPO, JSON.stringify(v)); } catch (h) {} }
  function veri() {
    var v = oku();
    if (!v.kayitlar) v.kayitlar = [];
    if (!v.sonraki) v.sonraki = 1;
    if (!v.fotolar) v.fotolar = {};
    return v;
  }
  function pad(n, h) { var m = String(n); while (m.length < h) m = '0' + m; return m; }
  function anahtar(m, r, s) { return (m ? m + '-' : '') + String(r || '').toUpperCase() + pad(Number(s) || 0, 2); }

  function islet(g) {
    var v = veri(), i;
    if (g.action === 'config') {
      return { ok:true, org:'Tarih Vakfı (DENEME)', kategoriler:KATEGORILER, durumlar:DURUMLAR,
        kurallar: KURALLAR.map(function (k) { return { kod:k[0], kategori:k[1], aciklama:k[2] }; }),
        mekanlar: MEKANLAR, rafHarfleri: RAF_HARFLERI, siraSayisi: SIRA_SAYISI };
    }
    if (KOORDINATOR_EYLEMLERI.indexOf(g.action) >= 0) {
      if (String(g.sifre || '') !== KOORD_SIFRE) {
        return { ok:false, sifreHatasi:true,
          error:'Bu ekran koordinatör şifresi ister. (Denemede: koordinator)' };
      }
    } else if (String(g.sifre || '') !== SIFRE) {
      return { ok:false, error:'Çalışma şifresi hatalı. (Denemede şifre: deneme)', sifreHatasi:true };
    }
    if (g.action === 'sayac') {
      var ad = String(g.kaydeden || '').toLowerCase();
      return { ok:true, toplam: v.kayitlar.length, bugun: v.kayitlar.length,
        benim: v.kayitlar.filter(function (k) { return String(k.kaydeden).toLowerCase() === ad; }).length };
    }
    if (g.action === 'rafDurum') {
      var a = anahtar(g.mekan, g.raf, g.sira);
      var ayni = v.kayitlar.filter(function (k) { return k.anahtar === a; });
      var son = ayni.reduce(function (e, k) { return Math.max(e, Number(k.siraNo) || 0); }, 0);
      return { ok:true, anahtar:a, sonNo:son, adet:ayni.length };
    }
    if (g.action === 'ekle' || g.action === 'guncelle') {
      var k = g.kayit || {};
      var baslik = String(k.baslik || '').trim();
      if (!baslik && !k.fotoVar) return { ok:false, error:'Başlık boş olamaz (ya da künye fotoğrafı çekin).' };
      if (!baslik) baslik = '(künye fotoğraftan gelecek)';
      if (!k.raf) return { ok:false, error:'Raf seçilmeli.' };
      if (!KATEGORILER[k.kategori]) return { ok:false, error:'Kategori seçilmeli.' };
      var uygun = KURALLAR.some(function (r) { return r[0] === k.kural && r[1] === k.kategori; });
      if (!uygun) return { ok:false, error:'Kural kodu bu kategoriye uymuyor.' };

      if (g.action === 'guncelle') {
        for (i = 0; i < v.kayitlar.length; i++) if (v.kayitlar[i].no === Number(g.no)) {
          v.kayitlar[i].yazar = k.yazar || ''; v.kayitlar[i].baslik = baslik;
          v.kayitlar[i].yil = k.yil || ''; v.kayitlar[i].not = k.not || '';
          v.kayitlar[i].kategori = KATEGORILER[k.kategori].ad; v.kayitlar[i].kural = k.kural;
          v.kayitlar[i].durum = k.durum || 'Sağlam';
          yaz(v); return { ok:true, no:Number(g.no) };
        }
        return { ok:false, error:'Kayıt bulunamadı.' };
      }

      var a2 = anahtar(k.mekan, k.raf, k.sira);
      var ayni2 = v.kayitlar.filter(function (x) { return x.anahtar === a2; });
      var dolu = {}; ayni2.forEach(function (x) { dolu[Number(x.siraNo)] = true; });
      var onerilen = Number(g.siraNo) || 0;
      var siraNo = (onerilen > 0 && !dolu[onerilen]) ? onerilen
        : ayni2.reduce(function (e, x) { return Math.max(e, Number(x.siraNo) || 0); }, 0) + 1;

      var kayit = {
        no: v.sonraki++, anahtar: a2, siraNo: siraNo,
        yer: a2 + '-' + pad(siraNo, 3),
        mekan: k.mekan || '', raf: k.raf, sira: pad(Number(k.sira) || 0, 2),
        yazar: k.yazar || '', baslik: baslik, yil: k.yil || '', nusha: k.nusha || 1,
        kategori: KATEGORILER[k.kategori].ad, kural: k.kural,
        durum: DURUMLAR.indexOf(k.durum) >= 0 ? k.durum : 'Sağlam',
        not: k.not || '', kaydeden: k.kaydeden || '', tarih: new Date().toISOString()
      };
      v.kayitlar.push(kayit); yaz(v);
      return { ok:true, no:kayit.no, yerKodu:kayit.yer, siraNo:siraNo,
        duzeltildi: onerilen > 0 && onerilen !== siraNo, rafAdet: ayni2.length + 1,
        sayac: { toplam: v.kayitlar.length } };
    }
    if (g.action === 'sil') {
      for (i = 0; i < v.kayitlar.length; i++) if (v.kayitlar[i].no === Number(g.no)) {
        delete v.fotolar[g.no]; v.kayitlar.splice(i, 1); yaz(v);
        return { ok:true, no:Number(g.no) };
      }
      return { ok:false, error:'Kayıt bulunamadı.' };
    }
    if (g.action === 'sonKayitlar') {
      var ad2 = String(g.kaydeden || '').trim().toLowerCase();
      return { ok:true, kayitlar: v.kayitlar.filter(function (k) {
        return !ad2 || String(k.kaydeden).toLowerCase() === ad2; }).slice(-8).reverse() };
    }
    if (g.action === 'fotoEkle') {
      for (i = 0; i < v.kayitlar.length; i++) if (v.kayitlar[i].no === Number(g.no)) {
        // Depo dolmasın diye yalnızca son birkaç fotoğraf tutulur.
        var anahtarlar = Object.keys(v.fotolar);
        while (anahtarlar.length > 3) delete v.fotolar[anahtarlar.shift()];
        if (String(g.hangi || 'kunye') === 'kapak') {
          v.fotolar['kapak-' + g.no] = g.veri;
          v.kayitlar[i].kapak = 'deneme';
          v.kayitlar[i].kapakGoruntu = g.veri;
          try { yaz(v); } catch (h) {}
          return { ok: true, no: Number(g.no), hangi: 'kapak' };
        }
        v.fotolar[g.no] = g.veri;
        v.kayitlar[i].foto = 'deneme';
        v.kayitlar[i].fotoGoruntu = g.veri;
        v.kayitlar[i].ocrDurum = 'bitti (deneme)';
        v.kayitlar[i].ocrMetin = 'DENEME — gerçek sistemde bu alanda fotoğraftan okunan metin olur.';
        v.kayitlar[i].oneriBaslik = 'ÖRNEK BAŞLIK (deneme)';
        v.kayitlar[i].oneriYazar = 'Örnek Yazar';
        v.kayitlar[i].oneriYil = '1946';
        try { yaz(v); } catch (h) {}
        return { ok:true, no:Number(g.no) };
      }
      return { ok:false, error:'Kayıt bulunamadı.' };
    }
    if (g.action === 'onayBekleyen') {
      var bek = v.kayitlar.filter(function (k) { return (k.foto || k.kapak) && !k.onay; });
      return { ok:true, kayitlar: bek.slice(0, Number(g.adet) || 25), kalan: bek.length };
    }
    if (g.action === 'durum') {
      var bugun = new Date().toISOString().slice(0, 10);
      var d2 = { ok:true, toplam:0, onayli:0, onayBekleyen:0, kunyeEksik:0, tamam:0,
        fotoli:0, kapakli:0, kategori:{}, fiziksel:{}, ocr:{}, gunluk:[], kisiler:[],
        siralar:[], hedef:0, hesaplandi:'deneme' };
      var kis = {}, sir = {}, gun2 = {};
      v.kayitlar.forEach(function (k) {
        d2.toplam++;
        if (k.foto) d2.fotoli++;
        if (k.kapak) d2.kapakli++;
        if (k.onay) d2.onayli++;
        else if (k.foto || k.kapak) d2.onayBekleyen++;
        else if (/künye fotoğraftan/i.test(k.baslik || '')) d2.kunyeEksik++;
        else d2.tamam++;
        d2.kategori[k.kategori] = (d2.kategori[k.kategori] || 0) + 1;
        d2.fiziksel[k.durum] = (d2.fiziksel[k.durum] || 0) + 1;
        if (k.foto || k.kapak) { var o = k.ocrDurum || 'yok'; d2.ocr[o] = (d2.ocr[o] || 0) + 1; }
        var g3 = String(k.tarih || '').slice(0, 10);
        if (g3) gun2[g3] = (gun2[g3] || 0) + 1;
        var ad2 = k.kaydeden || '—';
        if (!kis[ad2]) kis[ad2] = { ad: ad2, bugun: 0, toplam: 0 };
        kis[ad2].toplam++;
        if (g3 === bugun) kis[ad2].bugun++;
        if (k.anahtar) {
          if (!sir[k.anahtar]) sir[k.anahtar] = { sira: k.anahtar, sayi: 0, sonNo: 0, son: g3 };
          sir[k.anahtar].sayi++;
          sir[k.anahtar].sonNo = Math.max(sir[k.anahtar].sonNo, Number(k.siraNo) || 0);
        }
      });
      for (var j = 13; j >= 0; j--) {
        var g4 = new Date(new Date().getTime() - j * 86400000).toISOString().slice(0, 10);
        d2.gunluk.push({ gun: g4, sayi: gun2[g4] || 0 });
      }
      d2.kisiler = Object.keys(kis).map(function (a3) { return kis[a3]; });
      d2.siralar = Object.keys(sir).map(function (a3) { return sir[a3]; });
      return d2;
    }

    if (g.action === 'katalog') {
      var yalniz = g.yalnizOnayli !== false;
      var ara = String(g.ara || '').trim().toLowerCase();
      var liste = v.kayitlar.filter(function (k) {
        if (yalniz && !k.onay) return false;
        if (g.kategori && k.kategori !== g.kategori) return false;
        if (ara) {
          var havuz = [k.baslik, k.yazar, k.yer, k.not, k.kutu].join(' ').toLowerCase();
          if (havuz.indexOf(ara) < 0) return false;
        }
        return true;
      }).slice();
      liste.sort(function (a, b) {
        return String(g.sirala) === 'yer'
          ? String(a.yer).localeCompare(String(b.yer)) : Number(b.no) - Number(a.no);
      });
      var bas = Math.max(0, Number(g.bas) || 0);
      var adet = Math.min(Math.max(Number(g.adet) || 60, 1), 300);
      return { ok: true, toplam: liste.length, bas: bas, kayitlar: liste.slice(bas, bas + adet) };
    }

    if (g.action === 'onayla') {
      for (i = 0; i < v.kayitlar.length; i++) if (v.kayitlar[i].no === Number(g.no)) {
        var y = g.kayit || {};
        if (!String(y.baslik || '').trim()) return { ok:false, error:'Başlık boş olamaz.' };
        v.kayitlar[i].baslik = y.baslik; v.kayitlar[i].yazar = y.yazar || '';
        v.kayitlar[i].yil = y.yil || ''; v.kayitlar[i].not = y.not || '';
        v.kayitlar[i].onay = 'Onaylandı — ' + (y.onaylayan || '');
        yaz(v); return { ok:true, no:Number(g.no) };
      }
      return { ok:false, error:'Kayıt bulunamadı.' };
    }
    return { ok:false, error:'Bilinmeyen istek.' };
  }

  var gercekFetch = window.fetch.bind(window);
  window.fetch = function (adres, ayar) {
    if (String(adres).indexOf('deneme.yerel') < 0) return gercekFetch(adres, ayar);
    return new Promise(function (tamam, hata) {
      setTimeout(function () {
        if (agKapali) return hata(new TypeError('deneme: ağ kapalı'));
        var g = {};
        try { g = JSON.parse((ayar && ayar.body) || '{}'); } catch (h) {}
        var sonuc;
        try { sonuc = islet(g); } catch (h) { sonuc = { ok:false, error:'deneme hatası: ' + h.message }; }
        tamam({ ok:true, text: function () { return Promise.resolve(JSON.stringify(sonuc)); } });
      }, 250);
    });
  };

  /* ── deneme şeridi ── */
  document.addEventListener('DOMContentLoaded', function () {
    var s = document.createElement('div');
    s.id = 'demoSerit';
    s.innerHTML =
      '<div class="demo-ust"><b>DENEME MODU</b> — kayıtlar yalnızca bu telefonda, ' +
      'Google\'a hiçbir şey gitmiyor. Şifreler: gönüllü <b>deneme</b>, koordinatör ' +
      '<b>koordinator</b></div>' +
      '<div class="demo-dugmeler">' +
        '<button type="button" id="demoAg">İnterneti kes</button>' +
        '<button type="button" id="demoSil">Deneme kayıtlarını sil</button>' +
      '</div>';
    document.body.insertBefore(s, document.body.firstChild);

    var d = document.getElementById('demoAg');
    d.addEventListener('click', function () {
      agKapali = !agKapali;
      d.textContent = agKapali ? 'İnterneti aç' : 'İnterneti kes';
      d.className = agKapali ? 'kapali' : '';
      s.className = agKapali ? 'kesik' : '';
    });
    document.getElementById('demoSil').addEventListener('click', function () {
      if (!confirm('Deneme kayıtlarının hepsi silinsin mi?')) return;
      localStorage.removeItem(DEPO);
      localStorage.removeItem('tv_env_kuyruk');
      localStorage.removeItem('tv_env_foto_kuyruk');
      localStorage.removeItem('tv_env_sira');
      location.reload();
    });
  });
})();
</script>
<style>
  #demoSerit{background:#1f2937;color:#fff;padding:8px 12px;font:14px/1.4 system-ui,sans-serif;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #demoSerit.kesik{background:#92400e}
  #demoSerit .demo-ust{flex:1;min-width:200px;font-size:12.5px;opacity:.95}
  #demoSerit .demo-dugmeler{display:flex;gap:8px;margin-left:auto}
  #demoSerit button{background:#ffffff26;border:1px solid #ffffff59;color:#fff;border-radius:7px;
    padding:7px 11px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  #demoSerit button.kapali{background:#fbbf24;border-color:#fbbf24;color:#3b2600;font-weight:700}
  /* denemede Drive bağlantısı anlamsız */
  #fotoBag{display:none!important}
</style>

<script>
var ENVANTER_URL = window.TV_ENVANTER_URL || 'BURAYA_APPS_SCRIPT_ADRESINI_YAPISTIRIN';

(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var D = { ad: '', sifre: '', veri: null };

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  var sayi = function (n) { return Number(n || 0).toLocaleString('tr-TR'); };
  function goster(el, sinif, metin) { el.className = 'msg ' + sinif + ' gor'; el.innerHTML = metin; }
  function gizle(el) { el.className = 'msg'; }
  function mesgul(b, acik, metin) {
    if (acik) { b.dataset.eski = b.innerHTML; b.innerHTML = '<span class="donen"></span>' + (metin || '…'); b.disabled = true; }
    else { b.innerHTML = b.dataset.eski || b.innerHTML; b.disabled = false; }
  }

  /* Apps Script uykudan kalkarken ilk istek 20–30 saniye sürebiliyor; zayıf bağlantıda
     istek büsbütün düşebiliyor. Okuma istekleri otomatik tekrar denenir, yazma istekleri
     (onayla) denenmez — aynı kayıt iki kez işlenmesin. */
  var TEKRARLANABILIR = ['config', 'onayBekleyen', 'katalog', 'durum'];

  function tekIstek(action, yuk, sure) {
    var govde = { action: action, sifre: D.sifre };
    for (var k in (yuk || {})) govde[k] = yuk[k];
    var kes = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var saat = setTimeout(function () { if (kes) kes.abort(); }, sure);
    var bitir = function () { clearTimeout(saat); };
    return fetch(ENVANTER_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(govde), redirect: 'follow', signal: kes ? kes.signal : undefined
    }).catch(function () { bitir(); throw new Error('AĞ'); })
      .then(function (r) { bitir(); return r.text(); })
      .then(function (m) {
        var d;
        try { d = JSON.parse(m); } catch (h) {
          /* JSON yerine HTML geldiyse istek sunucuya ulaşıyor ama Apps Script yanıt
             vermiyor demektir. En sık sebebi dağıtımın erişim ayarıdır: yeni
             dağıtımlarda varsayılan "Yalnızca kendim"dir ve Google giriş sayfası döner. */
          throw new Error(/^\s*</.test(m)
            ? 'Sunucu JSON yerine web sayfası döndürdü. Apps Script dağıtımında ' +
              '“Erişimi olan: Herkes” seçili mi? (Yeni dağıtımlarda varsayılan “Yalnızca kendim”dir.)'
            : 'Sunucudan beklenmeyen yanıt.');
        }
        if (!d.ok) throw new Error(d.error || 'Hata');
        return d;
      });
  }

  function api(action, yuk) {
    if (/BURAYA_APPS_SCRIPT/.test(ENVANTER_URL)) {
      return Promise.reject(new Error('Sistem adresi tanımlanmamış (TV_ENVANTER_URL).'));
    }
    var kalan = TEKRARLANABILIR.indexOf(action) >= 0 ? 2 : 0;
    function dene(kalanDeneme, bekle) {
      return tekIstek(action, yuk, 30000)['catch'](function (e) {
        if (e.message !== 'AĞ' || kalanDeneme <= 0) throw e;
        return new Promise(function (t) { setTimeout(t, bekle); })
          .then(function () { return dene(kalanDeneme - 1, bekle * 2); });
      });
    }
    return dene(kalan, 1200);
  }

  function agHata(e) { return e.message === 'AĞ' ? 'Sunucuya ulaşılamadı.' : e.message; }

  /* ───────── giriş ───────── */
  $('btnGiris').addEventListener('click', function () {
    var ad = $('ad').value.trim(), sifre = $('sifre').value.trim();
    if (ad.length < 2) return goster($('msgGiris'), 'hata', 'Adınızı yazın.');
    if (!sifre) return goster($('msgGiris'), 'hata', 'Koordinatör şifresini yazın.');
    D.ad = ad; D.sifre = sifre;
    mesgul($('btnGiris'), true, 'Açılıyor…');
    yukle().then(function () {
      localStorage.setItem('tv_env_ad', ad);
      localStorage.setItem('tv_env_koord_sifre', sifre);
      gizle($('msgGiris'));
      $('adim-giris').classList.add('gizli');
      $('adim-pano').classList.remove('gizli');
      $('ust').classList.remove('gizli');
    })['catch'](function (e) {
      goster($('msgGiris'), 'hata', agHata(e));
    }).then(function () { mesgul($('btnGiris'), false); });
  });
  $('sifre').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnGiris').click(); });

  $('btnYenile').addEventListener('click', function () {
    mesgul($('btnYenile'), true, 'Yenileniyor…');
    yukle()['catch'](function (e) { goster($('msg'), 'hata', agHata(e)); })
      .then(function () { mesgul($('btnYenile'), false); });
  });

  function yukle() {
    return api('durum').then(function (r) { D.veri = r; ciz(); });
  }

  /* ───────── çizim ───────── */
  var KARAR = [
    { ad: 'Gidecek', renk: 'var(--gidecek)' },
    { ad: 'Gitse de olur', renk: 'var(--belki)' },
    { ad: 'Gitmeyecek', renk: 'var(--gitmeyecek)' },
    { ad: 'Belirsiz', renk: 'var(--belirsiz)' }
  ];

  function ciz() {
    var v = D.veri;
    $('ustZaman').textContent = v.hesaplandi ? 'son hesaplama ' + v.hesaplandi : '';
    gizle($('msg'));

    /* künye kutuları */
    var belirsiz = v.kategori['Belirsiz'] || 0;
    var oran = v.toplam ? Math.round(belirsiz / v.toplam * 100) : 0;
    $('kunyeler').innerHTML =
      kutu('Kaydedilen kitap', sayi(v.toplam), 'envanterdeki toplam satır', 'kahraman') +
      kutu('Künyesi onaylı', sayi(v.onayli),
        v.toplam ? '%' + Math.round(v.onayli / v.toplam * 100) + ' tamamlandı' : '') +
      kutu('Onay bekleyen', sayi(v.onayBekleyen), 'fotoğrafı var, künyesi tamamlanmadı') +
      kutu('Künyesi eksik', sayi(v.kunyeEksik), 'ne künye ne fotoğraf — elden geçmeli') +
      kutu('Belirsiz oranı', '%' + oran, oran > 15 ? 'kurallar yetersiz olabilir' : 'normal aralıkta');

    /* karar dağılımı — yığılmış çubuk + tablo */
    var toplam = KARAR.reduce(function (t, k) { return t + (v.kategori[k.ad] || 0); }, 0);
    $('kararAlt').textContent = toplam
      ? sayi(toplam) + ' kitap · yüzdeler toplam kayda göre'
      : 'Henüz kayıt yok.';
    $('kararYigin').innerHTML = KARAR.map(function (k) {
      var n = v.kategori[k.ad] || 0;
      if (!n) return '';
      var y = (n / toplam * 100);
      return '<span style="width:' + y.toFixed(2) + '%;background:' + k.renk + '" ' +
        'title="' + esc(k.ad) + ': ' + sayi(n) + ' kitap (%' + Math.round(y) + ')"></span>';
    }).join('');
    $('kararAciklama').innerHTML = KARAR.map(function (k) {
      var n = v.kategori[k.ad] || 0;
      return '<span><i style="background:' + k.renk + '"></i>' + esc(k.ad) +
        ' <b>' + sayi(n) + '</b>' + (toplam ? ' (%' + Math.round(n / toplam * 100) + ')' : '') + '</span>';
    }).join('');
    $('kararTablo').innerHTML = '<tr><th>Karar</th><th>Kitap</th><th>Oran</th></tr>' +
      KARAR.map(function (k) {
        var n = v.kategori[k.ad] || 0;
        return '<tr><td>' + esc(k.ad) + '</td><td>' + sayi(n) + '</td><td>' +
          (toplam ? '%' + Math.round(n / toplam * 100) : '—') + '</td></tr>';
      }).join('');

    /* günlük ilerleme */
    var enCok = Math.max.apply(null, v.gunluk.map(function (g) { return g.sayi; }).concat([1]));
    var sonGun = v.gunluk[v.gunluk.length - 1] || { sayi: 0 };
    $('gunlukSutun').innerHTML = v.gunluk.map(function (g, i) {
      var y = Math.round(g.sayi / enCok * 100);
      // Her sütuna sayı yazmak okunmuyor: yalnızca en yüksek gün ve bugün etiketlenir.
      var etiketle = g.sayi && (g.sayi === enCok || (i === v.gunluk.length - 1 && sonGun.sayi));
      return '<div class="gun" title="' + esc(gunAdi(g.gun)) + ': ' + sayi(g.sayi) + ' kitap">' +
        (etiketle ? '<div class="deger">' + g.sayi + '</div>' : '') +
        (g.sayi ? '<div class="cubuk" style="height:' + Math.max(y, 3) + '%"></div>' : '') +
        '</div>';
    }).join('');
    $('gunlukEksen').innerHTML = v.gunluk.map(function (g, i) {
      return '<div>' + (i % 2 === 0 ? esc(g.gun.slice(8) + '.' + g.gun.slice(5, 7)) : '') + '</div>';
    }).join('');
    var sonYedi = v.gunluk.slice(7).reduce(function (t, g) { return t + g.sayi; }, 0);
    $('gunlukNot').textContent = sonYedi
      ? 'Son yedi günde ' + sayi(sonYedi) + ' kitap · günlük ortalama ' + Math.round(sonYedi / 7)
      : 'Son yedi günde kayıt girilmemiş.';

    /* hedef çubuğu */
    if (v.hedef > 0) {
      $('hedefKart').classList.remove('gizli');
      var gidecek = v.kategori['Gidecek'] || 0, belki = v.kategori['Gitse de olur'] || 0;
      var en = Math.max(v.hedef, gidecek + belki);
      $('hedefAlt').textContent = 'Hedef kapasite: ' + sayi(v.hedef) + ' kitap';
      $('hedefOlcek').innerHTML =
        '<span style="width:' + (gidecek / en * 100).toFixed(2) + '%;background:var(--gidecek)"></span>' +
        '<span style="width:2px;background:var(--kagit)"></span>' +
        '<span style="width:' + (belki / en * 100).toFixed(2) + '%;background:var(--belki)"></span>';
      var asim = gidecek + belki - v.hedef;
      $('hedefAciklama').innerHTML =
        '<span><i style="background:var(--gidecek)"></i>Gidecek <b>' + sayi(gidecek) + '</b></span>' +
        '<span><i style="background:var(--belki)"></i>Gitse de olur <b>' + sayi(belki) + '</b></span>' +
        '<span>' + (asim > 0
          ? 'Kapasiteyi <b>' + sayi(asim) + '</b> kitap aşıyor — sarıların bir kısmı elenmeli'
          : 'Kapasiteye <b>' + sayi(-asim) + '</b> kitap yer var') + '</span>';
    } else {
      $('hedefKart').classList.add('gizli');
    }

    /* işleyiş */
    var kuflu = v.fiziksel['Küflü/böcekli'] || 0;
    var ocrHata = v.ocr['hata'] || 0;
    var ocrBekleyen = v.ocr['bekliyor'] || 0;
    $('isleyis').innerHTML =
      durumSatiri(kuflu ? 'ciddi' : 'iyi', 'Küflü/böcekli kitap',
        kuflu ? 'poşetlenip ayrı alanda mı?' : 'yok', kuflu) +
      durumSatiri('iyi', 'Fotoğrafı olan kayıt', v.fotoli + ' künye · ' + v.kapakli + ' kapak', v.fotoli) +
      durumSatiri(ocrBekleyen ? 'uyari' : 'iyi', 'Okunmayı bekleyen fotoğraf',
        ocrBekleyen ? 'zamanlayıcı 5 dakikada bir çalışır' : 'kuyruk boş', ocrBekleyen) +
      durumSatiri(ocrHata ? 'uyari' : 'iyi', 'Okunamayan fotoğraf',
        ocrHata ? 'künye elle yazılacak' : 'yok', ocrHata) +
      durumSatiri('iyi', 'Yıpranmış kitap', 'ciltleme listesine girebilir', v.fiziksel['Yıpranmış'] || 0);

    /* sıralar */
    $('siraTablo').innerHTML = '<tr><th>Sıra</th><th>Kitap</th><th>Son numara</th><th>Son kayıt</th></tr>' +
      (v.siralar.length ? v.siralar.map(function (s) {
        return '<tr><td class="ad">' + esc(s.sira) + '</td><td>' + sayi(s.sayi) + '</td><td>' +
          sayi(s.sonNo) + '</td><td>' + esc(gunAdi(s.son)) + '</td></tr>';
      }).join('') : '<tr><td colspan="4">Henüz kayıt yok.</td></tr>');

    /* kaydedenler */
    $('kisiTablo').innerHTML = '<tr><th>Kaydeden</th><th>Bugün</th><th>Toplam</th></tr>' +
      (v.kisiler.length ? v.kisiler.map(function (k) {
        return '<tr><td>' + esc(k.ad) + '</td><td>' + sayi(k.bugun) + '</td><td>' +
          sayi(k.toplam) + '</td></tr>';
      }).join('') : '<tr><td colspan="3">Henüz kayıt yok.</td></tr>');
  }

  function kutu(etiket, sayiMetni, alt, sinif) {
    return '<div class="kutu ' + (sinif || '') + '">' +
      '<div class="etiket">' + esc(etiket) + '</div>' +
      '<div class="sayi">' + esc(sayiMetni) + '</div>' +
      (alt ? '<div class="alt">' + esc(alt) + '</div>' : '') + '</div>';
  }
  function durumSatiri(tur, ad, aciklama, adet) {
    var im = { iyi: '✓', uyari: '!', ciddi: '!' }[tur];
    return '<div class="durum-satir"><span class="im ' + tur + '-r">' + im + '</span>' +
      '<span><b style="font-weight:600">' + esc(ad) + '</b> · ' +
      '<span style="color:var(--soluk);font-size:13px">' + esc(aciklama) + '</span></span>' +
      '<span class="sayi">' + sayi(adet) + '</span></div>';
  }
  function gunAdi(g) {
    if (!g) return '—';
    var d = new Date(g + 'T00:00:00');
    return isNaN(d) ? g : d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long' });
  }

  var ad = localStorage.getItem('tv_env_ad'), sifre = localStorage.getItem('tv_env_koord_sifre');
  if (ad) $('ad').value = ad;
  if (sifre) $('sifre').value = sifre;
})();
</script>
</body>
</html>
